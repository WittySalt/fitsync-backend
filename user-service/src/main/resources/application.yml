spring:
  application:
    name: user-service
  profiles:
    default: local
  datasource:
    url: ${LOCAL_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fitsync}}
    username: ${LOCAL_DB_USERNAME:${DB_USERNAME:fitsync}}
    password: ${LOCAL_DB_PASSWORD:${DB_PASSWORD:fitsync}}
    hikari:
      schema: user_domain
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: user_domain
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: user_domain
    schemas: user_domain
    table: user_domain_flyway_schema_history
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration: ${JWT_EXPIRATION:PT2H}

fitsync:
  media:
    endpoint: ${FITSYNC_MEDIA_ENDPOINT:http://localhost:9000}
    region: ${FITSYNC_MEDIA_REGION:us-east-1}
    access-key: ${FITSYNC_MEDIA_ACCESS_KEY:${MINIO_ROOT_USER:fitsync}}
    secret-key: ${FITSYNC_MEDIA_SECRET_KEY:${MINIO_ROOT_PASSWORD:fitsync-password}}
    # true in the cloud: credentials come from the EC2 instance role and the keys are ignored.
    aws-default-credentials: ${FITSYNC_MEDIA_AWS_DEFAULT_CREDENTIALS:false}
    bucket: ${FITSYNC_MEDIA_BUCKET:${MINIO_BUCKET:fitsync-media}}
    public-base-url: ${FITSYNC_MEDIA_PUBLIC_BASE_URL:http://localhost:9000/fitsync-media}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      user-events: ${KAFKA_USER_EVENTS_TOPIC:user-events}
    consumer-groups:
      user-service: ${KAFKA_USER_SERVICE_GROUP:user-service-consumer-group}
    listeners:
      user-registered:
        enabled: ${KAFKA_USER_REGISTERED_LISTENER_ENABLED:false}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:30000}
