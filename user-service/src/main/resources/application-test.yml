spring:
  datasource:
    url: jdbc:h2:mem:fitsync_user;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    listener:
      auto-startup: false

security:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expiration: PT1H

fitsync:
  kafka:
    enabled: false
    listeners:
      user-registered:
        enabled: false
