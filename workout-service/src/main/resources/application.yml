spring:
  application:
    name: workout-service
  profiles:
    default: local
  datasource:
    url: ${LOCAL_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fitsync}}
    username: ${LOCAL_DB_USERNAME:${DB_USERNAME:fitsync}}
    password: ${LOCAL_DB_PASSWORD:${DB_PASSWORD:fitsync}}
    hikari:
      schema: workout
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: workout
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: workout
    schemas: workout
    table: workout_flyway_schema_history
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
  # The shared catalogue search cache (CatalogueCacheConfig): Redis by default, SPRING_CACHE_TYPE=none turns
  # it off. A Redis failure falls back to the database, and the short timeouts keep that fallback quick.
  # The password, if any, binds from SPRING_DATA_REDIS_PASSWORD.
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:300ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:300ms}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # The cache is optional; Redis being down must not mark the service unhealthy.
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration: ${JWT_EXPIRATION:PT2H}

fitsync:
  # How long a catalogue search answer stays in Redis; imports evict it sooner.
  catalogue-cache:
    ttl: ${CATALOGUE_CACHE_TTL:PT1H}
  media:
    endpoint: ${FITSYNC_MEDIA_ENDPOINT:http://localhost:9000}
    region: ${FITSYNC_MEDIA_REGION:us-east-1}
    access-key: ${FITSYNC_MEDIA_ACCESS_KEY:${MINIO_ROOT_USER:fitsync}}
    secret-key: ${FITSYNC_MEDIA_SECRET_KEY:${MINIO_ROOT_PASSWORD:fitsync-password}}
    # true in the cloud: credentials come from the EC2 instance role and the keys are ignored.
    aws-default-credentials: ${FITSYNC_MEDIA_AWS_DEFAULT_CREDENTIALS:false}
    bucket: ${FITSYNC_MEDIA_BUCKET:${MINIO_BUCKET:fitsync-media}}
    public-base-url: ${FITSYNC_MEDIA_PUBLIC_BASE_URL:http://localhost:9000/fitsync-media}
  workout:
    catalog:
      auto-import: ${WORKOUT_CATALOG_AUTO_IMPORT:true}
      free-exercise-db:
        image-source-directory: ${FREE_EXERCISE_DB_IMAGE_SOURCE_DIRECTORY:}
        download-when-missing: ${FREE_EXERCISE_DB_DOWNLOAD_WHEN_MISSING:true}
        image-base-url: ${FREE_EXERCISE_DB_IMAGE_BASE_URL:https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/}
    exercise-history:
      max-range-days: ${WORKOUT_EXERCISE_HISTORY_MAX_RANGE_DAYS:370}
    auto-close:
      enabled: ${WORKOUT_AUTO_CLOSE_ENABLED:true}
      idle: ${WORKOUT_AUTO_CLOSE_IDLE:PT3H}
      sweep-interval: ${WORKOUT_AUTO_CLOSE_SWEEP_INTERVAL:PT15M}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      workout-events: ${KAFKA_WORKOUT_EVENTS_TOPIC:workout-events}
      user-events: ${KAFKA_USER_EVENTS_TOPIC:user-events}
    consumer-groups:
      workout-service: ${KAFKA_WORKOUT_SERVICE_GROUP:workout-service-consumer-group}
    listeners:
      account-deleted:
        enabled: ${KAFKA_ACCOUNT_DELETED_LISTENER_ENABLED:false}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      interval: ${OUTBOX_RELAY_INTERVAL:PT30S}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    # Published outbox rows carry full event payloads (weights, emails), so they are deleted after
    # the retention. PENDING and FAILED rows are never removed.
    cleanup:
      enabled: ${OUTBOX_CLEANUP_ENABLED:true}
      retention: ${OUTBOX_CLEANUP_RETENTION:P7D}
      batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
      interval: ${OUTBOX_CLEANUP_INTERVAL:PT1H}
