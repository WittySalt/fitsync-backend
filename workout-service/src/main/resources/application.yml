spring:
  application:
    name: workout-service
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitsync}
    username: ${DB_USERNAME:fitsync}
    password: ${DB_PASSWORD:fitsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration: ${JWT_EXPIRATION:PT2H}

fitsync:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      workout-events: ${KAFKA_WORKOUT_EVENTS_TOPIC:workout-events}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      interval: ${OUTBOX_RELAY_INTERVAL:PT30S}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
