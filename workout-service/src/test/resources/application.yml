spring:
  datasource:
    url: jdbc:h2:mem:workoutdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

security:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration: PT1H

fitsync:
  kafka:
    enabled: false
