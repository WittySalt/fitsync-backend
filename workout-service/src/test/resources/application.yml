spring:
  datasource:
    url: jdbc:h2:mem:workoutdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS workout;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      schema: workout
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: workout
  flyway:
    enabled: true
    default-schema: workout
    schemas: workout
    table: workout_flyway_schema_history

security:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration: PT1H

fitsync:
  workout:
    catalog:
      auto-import: false
    auto-close:
      enabled: false
  kafka:
    enabled: false
