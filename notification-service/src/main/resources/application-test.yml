spring:
  datasource:
    url: jdbc:h2:mem:fitsync_notification;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS notification;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      schema: notification
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  flyway:
    enabled: true
    default-schema: notification
    schemas: notification
    table: notification_flyway_schema_history
  kafka:
    listener:
      auto-startup: false

fitsync:
  notification:
    email:
      enabled: false
    app-base-url: https://app.fitsync.test
    scheduler:
      enabled: false
  kafka:
    enabled: false
