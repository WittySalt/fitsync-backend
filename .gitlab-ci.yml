workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - precheck
  - verify
  - security
  - docker
  - deploy

variables:
  IMAGE_NAME: "fitsync-backend"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: "overlay2"
  GIT_DEPTH: "0"

default:
  interruptible: true

.maven_job:
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
      - .m2/repository/org/owasp/dependency-check-data
  before_script:
    - cd "$CI_PROJECT_DIR"

.assume_aws_role:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    # Use Alpine's packaged aws-cli instead of `pip install awscli`: pip pulls a
    # python3 from the live repo whose pyexpat needs a newer expat than the one
    # baked into the docker:27.1.1-cli base image, which crashed with
    # "XML_SetAllocTrackerActivationThreshold: symbol not found".
    - apk add --no-cache bash curl jq openssh-client docker-cli aws-cli
    - >
      aws_sts_output=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    - export AWS_DEFAULT_REGION="$AWS_REGION"
    - aws sts get-caller-identity

secret_scan:
  stage: precheck
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

verify_backend:
  stage: verify
  extends: .maven_job
  needs: ["secret_scan"]
  variables:
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - mvn $MAVEN_CLI_OPTS verify -Psast -Dspring.profiles.active=test
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - auth-service/target/*.jar
      - "**/target/surefire-reports/"
      - "**/target/failsafe-reports/"
      - "**/target/site/jacoco/"
      - "**/target/spotbugsXml.xml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

docker_image:
  stage: docker
  image: docker:27.1.1-cli
  services:
    - name: docker:27.1.1-dind
  extends: .assume_aws_role
  needs:
    - job: verify_backend
      artifacts: true
  script:
    - export SHORT_SHA="${CI_COMMIT_SHA:0:8}"
    - export PRIMARY_TAG="latest"
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker build -t "$ECR_REGISTRY/$IMAGE_NAME:$PRIMARY_TAG" -t "$ECR_REGISTRY/$IMAGE_NAME:$SHORT_SHA" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" aquasec/trivy:0.56.2 image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format sarif --output /work/trivy-image.sarif "$ECR_REGISTRY/$IMAGE_NAME:$SHORT_SHA"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" aquasec/trivy:0.56.2 image --format cyclonedx --output /work/sbom.json "$ECR_REGISTRY/$IMAGE_NAME:$SHORT_SHA"
    - docker push "$ECR_REGISTRY/$IMAGE_NAME:$PRIMARY_TAG"
    - docker push "$ECR_REGISTRY/$IMAGE_NAME:$SHORT_SHA"
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - trivy-image.sarif
      - sbom.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

dependency_audit:
  stage: security
  extends: .maven_job
  variables:
    NVD_API_KEY: "$NVD_API_KEY"
  script:
    - mvn $MAVEN_CLI_OPTS dependency-check:aggregate -Pdependency-check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/dependency-check-report.*
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

deploy_prod:
  stage: deploy
  image: alpine:3.20
  extends: .assume_aws_role
  resource_group: production
  environment:
    name: production
  when: manual
  manual_confirmation: "Deploy the selected image to production?"
  script:
    - export IMAGE_TAG="${PROD_IMAGE_TAG:-${CI_COMMIT_SHA:0:8}}"
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - export IMAGE="$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker manifest inspect "$IMAGE" > /dev/null
    - mkdir -p ~/.ssh
    - printf "%s" "$PROD_EC2_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$PROD_EC2_HOST" >> ~/.ssh/known_hosts
    - |
      ssh -i ~/.ssh/id_ed25519 "ec2-user@$PROD_EC2_HOST" "set -euo pipefail
      ECR_REGISTRY='$ECR_REGISTRY'
      NEW_TAG='$IMAGE_TAG'
      DEPLOY_DIR='/opt/fitsync'
      ROLLBACK_FILE=\"\${DEPLOY_DIR}/.previous_prod_tag\"
      aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin \"\$ECR_REGISTRY\"
      docker pull \"$IMAGE\"
      CURRENT_TAG=\$(cat \"\$ROLLBACK_FILE\" 2>/dev/null || echo '')
      cd \"\$DEPLOY_DIR\"
      IMAGE_TAG=\"\$NEW_TAG\" docker compose -f docker-compose.prod.yml up -d --no-deps --wait auth-service
      HEALTHY=false
      for i in \$(seq 1 24); do
        STATUS=\$(curl -sf http://localhost:8080/actuator/health | jq -r '.status' 2>/dev/null || echo '')
        if [ \"\$STATUS\" = 'UP' ]; then HEALTHY=true; break; fi
        sleep 5
      done
      if [ \"\$HEALTHY\" = 'false' ]; then
        if [ -n \"\$CURRENT_TAG\" ]; then
          IMAGE_TAG=\"\$CURRENT_TAG\" docker compose -f docker-compose.prod.yml up -d --no-deps --wait auth-service
        fi
        exit 1
      fi
      echo \"\$NEW_TAG\" > \"\$ROLLBACK_FILE\""
    - |
      if [ "${SKIP_PROD_SMOKE:-false}" != "true" ]; then
        BASE="https://$PROD_DOMAIN"
        test "$(curl -sk -o /dev/null -w '%{http_code}' "$BASE/actuator/health")" = "200"
        test "$(curl -sk -o /dev/null -w '%{http_code}' "$BASE/api/v1/auth/login")" = "405"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
    - when: never
