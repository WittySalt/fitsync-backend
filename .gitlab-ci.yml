workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - precheck
  - verify
  - security
  - iac
  - stress
  - dast
  - docker
  - deploy

variables:
  # Each runnable service ships as its own image: fitsync-<service>.
  # (recommendation/notification are empty placeholder modules — not built.)
  RUNNABLE_SERVICES: "api-gateway auth-service user-service workout-service nutrition-service analytics-service"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: "overlay2"
  GIT_DEPTH: "0"

default:
  interruptible: true

# Fail fast (with a clear message) if a job's required CI/CD variables are missing,
# instead of erroring out half-way through ECR pushes or a prod deploy. Each job sets
# its own REQUIRED_VARS and splices this check in as the first script step via
# `!reference [.require_vars, script]`. Optional vars (SONAR_TOKEN, NVD_API_KEY) and
# ones with shell defaults are intentionally NOT listed.
.require_vars:
  script:
    - |
      missing=""
      for v in $REQUIRED_VARS; do
        eval "val=\${$v:-}"
        [ -z "$val" ] && missing="$missing $v"
      done
      if [ -n "$missing" ]; then
        echo "❌ Missing required CI/CD variable(s):$missing"
        echo "   → Set them in Settings → CI/CD → Variables, then re-run."
        exit 1
      fi
      echo "✓ Required vars present: $REQUIRED_VARS"

.maven_job:
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
      - .m2/repository/org/owasp/dependency-check-data
  before_script:
    - cd "$CI_PROJECT_DIR"

.assume_aws_role:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    # The docker:27.1.1-cli base image froze an older Alpine 3.20 snapshot whose
    # expat (2.6.x) predates the python3 that aws-cli pulls from the live 3.20 repo
    # (built against expat 2.7.x). The shared-object name (libexpat.so.1) still
    # matches, so apk does not upgrade expat on its own, and pyexpat fails to
    # relocate XML_SetAllocTrackerActivationThreshold. Upgrade the base image's
    # packages to the current repo first so expat matches python3, then install the
    # tools (incl. Alpine's packaged aws-cli instead of `pip install awscli`).
    - apk upgrade --no-cache
    - apk add --no-cache bash curl jq openssh-client docker-cli aws-cli
    - >
      aws_sts_output=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    - export AWS_DEFAULT_REGION="$AWS_REGION"
    - aws sts get-caller-identity

# Download a pinned Terraform onto an Alpine image. Pinned to the version used
# locally so CI never reads state written by a newer binary.
.tf_setup:
  variables:
    TF_VERSION: "1.15.7"
    TF_DIR: infra/terraform
  script:
    - apk add --no-cache curl unzip
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
    - unzip -o /tmp/tf.zip -d /usr/local/bin
    - terraform version

# ── CD only: Terraform runs on main, never on MRs (same rule as container build).
# `terraform plan` validates internally, so there is no separate validate job.
# Provisioning (terraform apply) is the deploy_staging job in the `deploy` stage.

tf_plan:
  stage: iac
  image: alpine:3.20
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  needs: []
  variables:
    TF_VERSION: "1.15.7"
    REQUIRED_VARS: "AWS_ROLE_ARN AWS_REGION"
  before_script:
    - !reference [.assume_aws_role, before_script]
    - !reference [.tf_setup, script]
  script:
    - !reference [.require_vars, script]
    - cd infra/terraform
    - terraform init
    - terraform workspace select staging || terraform workspace new staging
    - terraform plan -var-file=staging.tfvars -out=tfplan
  artifacts:
    paths:
      - infra/terraform/tfplan
    expire_in: 7 days
  rules:
    # Requires the S3 remote-state backend to be bootstrapped (see RUNBOOK).
    - if: '$CI_COMMIT_BRANCH == "main" && $AWS_ROLE_ARN'
    - when: never

secret_scan:
  stage: precheck
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

verify_backend:
  stage: verify
  extends: .maven_job
  needs: ["secret_scan"]
  variables:
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    # Build, test, coverage (JaCoCo) + SAST (SpotBugs) for all modules. When a
    # SONAR_TOKEN is configured, also publish to SonarQube/SonarCloud and block on
    # the Quality Gate (code smells, coverage, duplication, security hotspots).
    # Sonar stays off until the token is set, so the pipeline is green by default.
    - |
      SONAR_ARGS=""
      if [ -n "$SONAR_TOKEN" ]; then
        SONAR_ARGS="sonar:sonar \
          -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io} \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.projectKey=$SONAR_PROJECT_KEY \
          -Dsonar.organization=$SONAR_ORGANIZATION \
          -Dsonar.qualitygate.wait=${SONAR_QUALITYGATE_WAIT:-true}"
      fi
    # -T 2 builds independent modules two-at-a-time (parallel reactor). Kept at 2
    # rather than 1C because each module's integration tests spin up Testcontainers;
    # bump toward 1C once a run confirms the runner has the memory/Docker headroom.
    - mvn $MAVEN_CLI_OPTS -T 2 verify -Psast -Dspring.profiles.active=test $SONAR_ARGS
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      # All 6 runnable fat jars — the docker stage copies these into images.
      - api-gateway/target/api-gateway-*.jar
      - auth-service/target/auth-service-*.jar
      - user-service/target/user-service-*.jar
      - workout-service/target/workout-service-*.jar
      - nutrition-service/target/nutrition-service-*.jar
      - analytics-service/target/analytics-service-*.jar
      - "**/target/surefire-reports/"
      - "**/target/failsafe-reports/"
      - "**/target/site/jacoco/"
      - "**/target/spotbugsXml.xml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

docker_image:
  stage: docker
  image: docker:27.1.1-cli
  services:
    - name: docker:27.1.1-dind
  extends: .assume_aws_role
  needs:
    - job: verify_backend
      artifacts: true
  # Persist Trivy's vuln + Java DB (~1GB) across runs so the 6-image loop and
  # subsequent pipelines reuse it instead of re-downloading from ghcr.io.
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  variables:
    # AWS_ROLE_ARN is guaranteed by this job's rules; the account/region are not.
    REQUIRED_VARS: "AWS_ROLE_ARN AWS_ACCOUNT_ID AWS_REGION"
  script:
    - !reference [.require_vars, script]
    - export SHORT_SHA="${CI_COMMIT_SHA:0:8}"
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    # Build + tag all 6 services as $ECR_REGISTRY/fitsync-<svc>:$SHORT_SHA (no push yet).
    - ECR_REGISTRY="$ECR_REGISTRY" IMAGE_TAG="$SHORT_SHA" PUSH=0 bash scripts/build-images.sh
    - |
      for svc in $RUNNABLE_SERVICES; do
        repo="fitsync-$svc"
        img="$ECR_REGISTRY/$repo"
        echo "==> $repo: ensure ECR repo, scan, push"
        aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
          || aws ecr create-repository --repository-name "$repo" \
               --image-scanning-configuration scanOnPush=true >/dev/null
        # Visible triage report of all fixable HIGH+CRITICAL findings (non-blocking).
        # The cached Trivy DB is mounted so it is not re-downloaded for every image.
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
          -v "$PWD/.trivycache:/root/.cache/trivy" \
          aquasec/trivy:0.56.2 image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
          --format table "$img:$SHORT_SHA"
        # Gate: block the push only on fixable CRITICAL CVEs. HIGH is reported above
        # but not gated (a lot of HIGH come from the base image and can't be fixed here).
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
          -v "$PWD/.trivycache:/root/.cache/trivy" \
          aquasec/trivy:0.56.2 image --scanners vuln --severity CRITICAL --ignore-unfixed \
          --exit-code 1 --format sarif --output "/work/trivy-$svc.sarif" "$img:$SHORT_SHA"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
          -v "$PWD/.trivycache:/root/.cache/trivy" \
          aquasec/trivy:0.56.2 image --format cyclonedx --output "/work/sbom-$svc.json" "$img:$SHORT_SHA"
        docker tag "$img:$SHORT_SHA" "$img:latest"
        docker push "$img:$SHORT_SHA"
        docker push "$img:latest"
      done
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - "trivy-*.sarif"
      - "sbom-*.json"
  rules:
    # Only build/push the image once AWS is wired up. AWS_ROLE_ARN is supplied as a
    # CI/CD variable; while it is unset (no ECR/EC2 provisioned yet) this job is
    # skipped so the main pipeline stays green. Set the variable to auto-enable it.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $AWS_ROLE_ARN'
    - when: never

stress_test:
  stage: stress
  image:
    name: grafana/k6:0.49.0
    entrypoint: [""]
  needs: []
  script:
    - |
      if [ -z "$STRESS_TARGET_URL" ]; then
        echo "STRESS_TARGET_URL is not set — define it (and STRESS_USER_EMAIL/PASSWORD) as CI/CD variables."
        exit 1
      fi
    - >
      k6 run
      -e BASE_URL="$STRESS_TARGET_URL"
      -e USER_EMAIL="$STRESS_USER_EMAIL"
      -e USER_PASSWORD="$STRESS_USER_PASSWORD"
      -e PROFILE="${STRESS_PROFILE:-load}"
      stress/k6/load-test.js
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - stress/k6/summary.json
      - stress/k6/summary.txt
  rules:
    # Manual: it hits a live deployed environment, so it is opt-in from the
    # pipeline UI ("Run pipeline") rather than firing on every MR.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

# ── DAST: dynamic black-box scan of a live deployed environment (OWASP ZAP) ───
# Mirrors stress_test: hits an already-running environment via a URL variable,
# web-manual ("Run pipeline"), never fires on MRs, never blocks the pipeline.
# Complements the static security stages (gitleaks secret-scan, SpotBugs SAST in
# verify, OWASP dependency-check, Trivy image scan) with runtime testing.
#
# Set as CI/CD variables before running:
#   DAST_TARGET_URL   (required) base URL of the live gateway, e.g. https://<host>
#   DAST_OPENAPI_URL  (optional) OpenAPI/Swagger JSON URL for the richer API scan,
#                     e.g. https://<host>/v3/api-docs — enables endpoint-by-endpoint
#                     coverage instead of just the passively-spidered surface.
dast_zap:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  needs: []
  script:
    - |
      if [ -z "$DAST_TARGET_URL" ]; then
        echo "DAST_TARGET_URL is not set — define the live gateway base URL as a CI/CD variable."
        echo "Optional: DAST_OPENAPI_URL (OpenAPI/Swagger JSON) for the richer API scan."
        exit 1
      fi
    - mkdir -p "$CI_PROJECT_DIR/dast"
    # 1) Passive baseline scan of the reachable surface (spider + passive rules).
    #    -I = report-only (never exit non-zero on warnings); reports land in /zap/wrk.
    - zap-baseline.py -t "$DAST_TARGET_URL" -r zap-baseline.html -w zap-baseline.md -J zap-baseline.json -I || true
    # 2) OpenAPI-driven API scan — only when a spec URL is provided (covers every
    #    documented endpoint, not just what the spider can reach on a JSON API).
    - |
      if [ -n "$DAST_OPENAPI_URL" ]; then
        zap-api-scan.py -t "$DAST_OPENAPI_URL" -f openapi -r zap-api.html -w zap-api.md -J zap-api.json -I || true
      fi
    # ZAP writes into /zap/wrk; lift the reports into the workspace for artifacts.
    - cp /zap/wrk/zap-*.html /zap/wrk/zap-*.md /zap/wrk/zap-*.json "$CI_PROJECT_DIR/dast/" 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dast/
  rules:
    # Manual: it hits a live deployed environment, so it is opt-in from the
    # pipeline UI ("Run pipeline") rather than firing on every MR — same as stress.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

dependency_audit:
  stage: security
  extends: .maven_job
  variables:
    NVD_API_KEY: "$NVD_API_KEY"
  script:
    - mvn $MAVEN_CLI_OPTS dependency-check:aggregate -Pdependency-check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/dependency-check-report.*
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never

# ── CD: provision/update STAGING via Terraform ───────────────────────────────
# The staging environment is delivered entirely by Terraform. Separate lane from
# deploy_prod, separate environment, separate AWS resources (fitsync-staging-*).
deploy_staging:
  stage: deploy
  image: alpine:3.20
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  resource_group: staging
  environment:
    name: staging
  needs:
    - job: tf_plan
      artifacts: true
  variables:
    TF_VERSION: "1.15.7"
    REQUIRED_VARS: "AWS_ROLE_ARN AWS_REGION"
  before_script:
    - !reference [.assume_aws_role, before_script]
    - !reference [.tf_setup, script]
  script:
    - !reference [.require_vars, script]
    - cd infra/terraform
    - terraform init
    - terraform workspace select staging
    # Apply the exact plan produced by tf_plan in this pipeline.
    - terraform apply -auto-approve tfplan
  rules:
    # Manual gate, only after tf_plan; requires the S3 remote-state backend
    # (see RUNBOOK "Remote state bootstrap"). Hidden until AWS_ROLE_ARN is set.
    - if: '$CI_COMMIT_BRANCH == "main" && $AWS_ROLE_ARN'
      when: manual
      allow_failure: false
    - when: never

deploy_prod:
  stage: deploy
  image: alpine:3.20
  extends: .assume_aws_role
  resource_group: production
  environment:
    name: production
  when: manual
  manual_confirmation: "Deploy the selected image to production?"
  variables:
    # Validate every secret the deploy consumes BEFORE it ssh's in and rewrites
    # the prod .env. Vars with shell defaults (JWT_EXPIRATION, COGNITO_ENABLED,
    # PROD_DOMAIN, FITSYNC_MEDIA_*) are intentionally omitted.
    REQUIRED_VARS: >-
      AWS_ROLE_ARN AWS_ACCOUNT_ID AWS_REGION
      DB_URL AUTH_DB_PASSWORD USER_DB_PASSWORD WORKOUT_DB_PASSWORD
      NUTRITION_DB_PASSWORD ANALYTICS_DB_PASSWORD JWT_SECRET
      PROD_EC2_SSH_KEY PROD_EC2_HOST
  script:
    - !reference [.require_vars, script]
    - export IMAGE_TAG="${PROD_IMAGE_TAG:-${CI_COMMIT_SHA:0:8}}"
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    # Refuse to touch prod unless all 6 images exist for this tag.
    - |
      for svc in $RUNNABLE_SERVICES; do
        docker manifest inspect "$ECR_REGISTRY/fitsync-$svc:$IMAGE_TAG" > /dev/null
      done
    - mkdir -p ~/.ssh
    - printf "%s" "$PROD_EC2_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$PROD_EC2_HOST" >> ~/.ssh/known_hosts
    # Render the runtime .env from CI/CD variables (secrets never live in the repo).
    - |
      cat > .env.deploy <<EOF
      ECR_REGISTRY=$ECR_REGISTRY
      IMAGE_TAG=$IMAGE_TAG
      DB_URL=$DB_URL
      AUTH_DB_PASSWORD=$AUTH_DB_PASSWORD
      USER_DB_PASSWORD=$USER_DB_PASSWORD
      WORKOUT_DB_PASSWORD=$WORKOUT_DB_PASSWORD
      NUTRITION_DB_PASSWORD=$NUTRITION_DB_PASSWORD
      ANALYTICS_DB_PASSWORD=$ANALYTICS_DB_PASSWORD
      JWT_SECRET=$JWT_SECRET
      JWT_EXPIRATION=${JWT_EXPIRATION:-PT2H}
      REDIS_HOST=redis
      REDIS_PORT=6379
      SPRING_CACHE_TYPE=${SPRING_CACHE_TYPE:-simple}
      SPRING_DATA_REDIS_HOST=redis
      SPRING_DATA_REDIS_PORT=6379
      KAFKA_ENABLED=true
      OUTBOX_RELAY_ENABLED=true
      KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      KAFKA_USER_REGISTERED_LISTENER_ENABLED=true
      KAFKA_GOAL_UPDATED_LISTENER_ENABLED=true
      KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED=true
      KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED=true
      KAFKA_MEAL_LOGGED_LISTENER_ENABLED=true
      KAFKA_MEAL_UPDATED_LISTENER_ENABLED=true
      KAFKA_MEAL_DELETED_LISTENER_ENABLED=true
      KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED=true
      KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED=true
      KAFKA_WORKOUT_DELETED_LISTENER_ENABLED=true
      COGNITO_ENABLED=${COGNITO_ENABLED:-false}
      NGINX_SERVER_NAME=${PROD_DOMAIN:-_}
      NGINX_CERT_NAME=${PROD_DOMAIN:-localhost}
      FITSYNC_MEDIA_ENDPOINT=${FITSYNC_MEDIA_ENDPOINT}
      FITSYNC_MEDIA_REGION=${FITSYNC_MEDIA_REGION:-ap-southeast-1}
      FITSYNC_MEDIA_ACCESS_KEY=${FITSYNC_MEDIA_ACCESS_KEY}
      FITSYNC_MEDIA_SECRET_KEY=${FITSYNC_MEDIA_SECRET_KEY}
      FITSYNC_MEDIA_BUCKET=${FITSYNC_MEDIA_BUCKET:-fitsync-media}
      FITSYNC_MEDIA_PUBLIC_BASE_URL=${FITSYNC_MEDIA_PUBLIC_BASE_URL}
      FREE_EXERCISE_DB_IMAGES_DIR=${FREE_EXERCISE_DB_IMAGES_DIR:-/opt/fitsync/free-exercise-db/exercises}
      EOF
    # Stage deploy assets on the host, then bootstrap + deploy via the host script.
    - ssh -i ~/.ssh/id_ed25519 "ec2-user@$PROD_EC2_HOST" "sudo mkdir -p /opt/fitsync/nginx && sudo chown -R ec2-user:ec2-user /opt/fitsync"
    - scp -i ~/.ssh/id_ed25519 docker-compose.prod.yml "ec2-user@$PROD_EC2_HOST:/opt/fitsync/docker-compose.prod.yml"
    - scp -i ~/.ssh/id_ed25519 nginx/nginx.conf.template "ec2-user@$PROD_EC2_HOST:/opt/fitsync/nginx/nginx.conf.template"
    - scp -i ~/.ssh/id_ed25519 scripts/ec2-deploy.sh "ec2-user@$PROD_EC2_HOST:/opt/fitsync/ec2-deploy.sh"
    - scp -i ~/.ssh/id_ed25519 .env.deploy "ec2-user@$PROD_EC2_HOST:/opt/fitsync/.env"
    - >
      ssh -i ~/.ssh/id_ed25519 "ec2-user@$PROD_EC2_HOST"
      "ECR_REGISTRY='$ECR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' AWS_REGION='$AWS_REGION'
      bash /opt/fitsync/ec2-deploy.sh"
    # Optional external smoke test — needs nginx + TLS, so opt-in once configured.
    - |
      if [ "${RUN_PROD_SMOKE:-false}" = "true" ]; then
        BASE="https://$PROD_DOMAIN"
        test "$(curl -sk -o /dev/null -w '%{http_code}' "$BASE/actuator/health")" = "200"
      fi
  rules:
    # Manual production deploy, only offered once AWS/EC2 is configured (AWS_ROLE_ARN
    # plus the PROD_EC2_* / PROD_DOMAIN variables). Hidden until then.
    - if: '$CI_COMMIT_BRANCH == "main" && $AWS_ROLE_ARN'
      when: manual
      allow_failure: false
    - when: never
