services:
  postgres:
    image: postgres:16-alpine
    container_name: fitsync-postgres
    environment:
      POSTGRES_DB: fitsync
      POSTGRES_USER: fitsync
      POSTGRES_PASSWORD: fitsync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitsync -d fitsync"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: fitsync-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: fitsync-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitsync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fitsync-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    container_name: fitsync-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitsync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fitsync-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-fitsync-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing local/\"$${MINIO_BUCKET}\";
      mc anonymous set download local/\"$${MINIO_BUCKET}\";
      "

  workout-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: workout-service
        SERVER_PORT: 8082
    image: fitsync-workout-service:${IMAGE_TAG:-latest}
    container_name: fitsync-workout-service
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/fitsync
      DB_USERNAME: fitsync
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fitsync}
      SERVER_PORT: 8082
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      FITSYNC_MEDIA_ENDPOINT: http://minio:9000
      FITSYNC_MEDIA_REGION: ${FITSYNC_MEDIA_REGION:-us-east-1}
      FITSYNC_MEDIA_ACCESS_KEY: ${MINIO_ROOT_USER:-fitsync}
      FITSYNC_MEDIA_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fitsync-password}
      FITSYNC_MEDIA_BUCKET: ${MINIO_BUCKET:-fitsync-media}
      FITSYNC_MEDIA_PUBLIC_BASE_URL: http://localhost:9000/${MINIO_BUCKET:-fitsync-media}
      FREE_EXERCISE_DB_IMAGE_SOURCE_DIRECTORY: /opt/fitsync/free-exercise-db/exercises
      WORKOUT_CATALOG_AUTO_IMPORT: ${WORKOUT_CATALOG_AUTO_IMPORT:-true}
    ports:
      - "8082:8082"
    volumes:
      - ${FREE_EXERCISE_DB_IMAGES_DIR:-./.local/free-exercise-db/exercises}:/opt/fitsync/free-exercise-db/exercises:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  kafka:
    image: apache/kafka:3.7.0
    container_name: fitsync-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  kafka-data:
  minio-data:

# Put every service in this file on the SAME docker network that the
# docker-compose.prod.yml app services use (project `backend` -> `backend_fitsync-net`).
# Without this, this file's services default to `backend_default`, which splits
# redis/kafka/minio off from prod-compose app services in the hybrid local run
# (app from prod compose, infra from here) -> auth/analytics can't reach `redis`
# and time out. See memory: project-local-run-auth (DOCKER NETWORK SPLIT gotcha).
networks:
  default:
    name: backend_fitsync-net
