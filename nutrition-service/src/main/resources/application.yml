spring:
  application:
    name: nutrition-service
  profiles:
    default: local
  datasource:
    url: ${LOCAL_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fitsync}}
    username: ${LOCAL_DB_USERNAME:${DB_USERNAME:fitsync}}
    password: ${LOCAL_DB_PASSWORD:${DB_PASSWORD:fitsync}}
    hikari:
      schema: nutrition
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: nutrition
  flyway:
    enabled: true
    # db/migration = schema + core seeds (run everywhere incl. tests), versions V1..V899;
    # db/seed = large prod-only data seeds (USDA foods), versions V900+ — excluded in the test
    # profile. Flyway shares ONE version namespace across both locations, so the ranges must not
    # overlap: a seed numbered inside the schema range collides with a future migration and the
    # service refuses to start. DuplicateFlywayVersionTest enforces this.
    # db/postgres holds PostgreSQL-only DDL (pg_trgm); the test profile leaves it out because H2 cannot run it.
    locations: classpath:db/migration,classpath:db/seed,classpath:db/postgres
    # A database that has run the V900 seed sees every later schema migration as older than what
    # it has applied, and would refuse to start. Schema migrations are therefore allowed to run
    # after a higher seed version.
    out-of-order: true
    default-schema: nutrition
    schemas: nutrition
    table: nutrition_flyway_schema_history
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
  # The shared catalogue search cache (CatalogueCacheConfig): Redis by default, SPRING_CACHE_TYPE=none turns
  # it off. A Redis failure falls back to the database, and the short timeouts keep that fallback quick.
  # The password, if any, binds from SPRING_DATA_REDIS_PASSWORD.
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:300ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:300ms}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # The cache is optional; Redis being down must not mark the service unhealthy.
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration: ${JWT_EXPIRATION:PT2H}

fitsync:
  # How long a catalogue search answer stays in Redis; imports evict it sooner.
  catalogue-cache:
    ttl: ${CATALOGUE_CACHE_TTL:PT1H}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      nutrition-events: ${KAFKA_NUTRITION_EVENTS_TOPIC:nutrition-events}
      progress-events: ${KAFKA_PROGRESS_EVENTS_TOPIC:progress-events}
      user-events: ${KAFKA_USER_EVENTS_TOPIC:user-events}
    consumer-groups:
      nutrition-service: ${KAFKA_NUTRITION_SERVICE_GROUP:nutrition-service-consumer-group}
    listeners:
      goal-updated:
        enabled: ${KAFKA_GOAL_UPDATED_LISTENER_ENABLED:false}
      user-preferences-updated:
        enabled: ${KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED:false}
      nutrition-reference-profile-updated:
        enabled: ${KAFKA_NUTRITION_REFERENCE_PROFILE_UPDATED_LISTENER_ENABLED:false}
      body-metrics-recorded:
        enabled: ${KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED:false}
      account-deleted:
        enabled: ${KAFKA_ACCOUNT_DELETED_LISTENER_ENABLED:false}
  nutrition:
    # Typo-tolerant food search through pg_trgm; false turns the fuzzy fallback off.
    fuzzy-search-enabled: ${FITSYNC_FUZZY_SEARCH_ENABLED:true}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:30000}
    # Published outbox rows carry full event payloads (weights, emails), so they are deleted after
    # the retention. PENDING and FAILED rows are never removed.
    cleanup:
      enabled: ${OUTBOX_CLEANUP_ENABLED:true}
      retention: ${OUTBOX_CLEANUP_RETENTION:P7D}
      batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
      interval: ${OUTBOX_CLEANUP_INTERVAL:PT1H}
