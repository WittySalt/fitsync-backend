spring:
  datasource:
    url: jdbc:h2:mem:fitsync_nutrition;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS nutrition;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      schema: nutrition
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nutrition
  flyway:
    enabled: true
    # Core only — exclude db/seed (the large USDA prod seed) so tests stay fast.
    locations: classpath:db/migration
    default-schema: nutrition
    schemas: nutrition
    table: nutrition_flyway_schema_history
  kafka:
    listener:
      auto-startup: false

security:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expiration: PT1H

fitsync:
  kafka:
    enabled: false
