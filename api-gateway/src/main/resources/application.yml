spring:
  application:
    name: api-gateway
  profiles:
    default: local
  # Redis holds the revoked-session deny-list (RevokedSessionFilter) and the rate limit counters
  # (RateLimitFilter). Both are asked on the request path and both fail open, so the timeouts are short.
  # The password, if any, binds from SPRING_DATA_REDIS_PASSWORD.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:200ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:200ms}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # The deny-list and the rate limiter both fail open, so Redis being down must not mark the gateway
  # unhealthy: the ALB health check reads /actuator/health.
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  cognito:
    enabled: ${COGNITO_ENABLED:false}
    issuer-uri: ${COGNITO_ISSUER_URI:}
    jwk-set-uri: ${COGNITO_JWK_SET_URI:}
    audience: ${COGNITO_AUDIENCE:}
    principal-claim: ${COGNITO_PRINCIPAL_CLAIM:username}

fitsync:
  gateway:
    cors:
      allowed-origins: ${FITSYNC_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,https://d26vi6hikexzev.cloudfront.net,https://fitsyncapp.click,https://www.fitsyncapp.click}
    routes:
      auth-service-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8080}
      user-service-base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
      workout-service-base-url: ${WORKOUT_SERVICE_BASE_URL:http://localhost:8082}
      nutrition-service-base-url: ${NUTRITION_SERVICE_BASE_URL:http://localhost:8083}
      analytics-service-base-url: ${ANALYTICS_SERVICE_BASE_URL:http://localhost:8085}
      recommendation-service-base-url: ${RECOMMENDATION_SERVICE_BASE_URL:http://localhost:8086}
      notification-service-base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8087}
    # Per-caller limits over a fixed window, counted in Redis (see GatewayRateLimitProperties).
    # On by default; set GATEWAY_RATE_LIMIT_ENABLED=false to switch it off locally. Trusted proxy hops is
    # how many proxies append to X-Forwarded-For in front of the gateway: 0 locally, 2 behind CloudFront + ALB.
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
      window: ${GATEWAY_RATE_LIMIT_WINDOW:PT1M}
      general-limit: ${GATEWAY_RATE_LIMIT_GENERAL:120}
      auth-limit: ${GATEWAY_RATE_LIMIT_AUTH:10}
      # POST /api/v1/auth/refresh: its own per-address counter, so refreshes never use up the sign-in budget.
      refresh-limit: ${GATEWAY_RATE_LIMIT_REFRESH:60}
      trusted-proxy-hops: ${GATEWAY_RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
      redis-backoff: ${GATEWAY_RATE_LIMIT_REDIS_BACKOFF:PT30S}
