# Dependency vulnerability scan (ported from the manual `dependency_audit` job).
# Manual-only: the NVD database download + aggregate scan adds several minutes, so
# it is not part of the per-push CI. Run it from the Actions tab → "Run workflow".
# Set the optional NVD_API_KEY secret to speed up the NVD data download.
name: Dependency Check

on:
  workflow_dispatch:

env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: OWASP dependency-check (aggregate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn $MAVEN_CLI_OPTS dependency-check:aggregate -Pdependency-check
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 7
          if-no-files-found: warn
