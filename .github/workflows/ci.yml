# CI: code validation.
# Runs on pull requests and pushes to main. No AWS access, no deployment — purely
# verifies the code: secret scanning, build + unit/integration tests + SAST.
# Dependency scanning is a separate manual workflow (dependency-check.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  RUNNABLE_SERVICES: "api-gateway auth-service user-service workout-service nutrition-service analytics-service recommendation-service notification-service"

jobs:
  # ── precheck: secret scanning ───────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.24.2
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks container runs as root; the checkout is owned by another uid,
      # so git refuses with "dubious ownership". Allow it before scanning.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory '*'
      - name: gitleaks detect
        run: gitleaks detect --source . --verbose --redact

  # ── verify: build + unit/integration tests + coverage (JaCoCo) + SAST (SpotBugs) ──
  # coverage-report fails the build when merged line coverage is below 80 %.
  # Docker is available on ubuntu-latest, so Testcontainers integration tests run.
  # When SONAR_TOKEN is set, also publishes to SonarCloud/SonarQube and blocks on
  # the Quality Gate. Sonar stays off until the token is set (green by default).
  verify-backend:
    runs-on: ubuntu-latest
    needs: secret-scan
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Broker-backed ITs (UserRegisteredKafkaIT, WorkoutRelayKafkaIT) use the kafka
      # service below; UserAvatarUploadIT starts its own MinIO via Testcontainers.
      KAFKA_INTEGRATION_TESTS: "true"
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      MINIO_INTEGRATION_TESTS: "true"
    # Single-node KRaft broker, same image as docker-compose.yml. Steps run on the
    # runner host, so the broker advertises localhost:9092.
    services:
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, test, coverage + SAST (Sonar if token set)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_QUALITYGATE_WAIT: ${{ vars.SONAR_QUALITYGATE_WAIT }}
        run: |
          SONAR_ARGS=""
          if [ -n "$SONAR_TOKEN" ]; then
            SONAR_ARGS="sonar:sonar \
              -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io} \
              -Dsonar.token=$SONAR_TOKEN \
              -Dsonar.projectKey=$SONAR_PROJECT_KEY \
              -Dsonar.organization=$SONAR_ORGANIZATION \
              -Dsonar.qualitygate.wait=${SONAR_QUALITYGATE_WAIT:-true}"
          fi
          # -T 2: two modules in parallel; each spins up Testcontainers.
          mvn $MAVEN_CLI_OPTS -T 2 verify -Psast -Dspring.profiles.active=test $SONAR_ARGS
      # Reports only — the fat jars (~800MB/run) blew the account artifact quota;
      # CD builds its own jars, so CI never needs to keep them. Non-fatal so a
      # quota hiccup can't fail an otherwise green build.
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            **/target/spotbugsXml.xml
          retention-days: 5
          if-no-files-found: warn
