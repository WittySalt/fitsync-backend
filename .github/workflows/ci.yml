# CI: code validation (ported from .gitlab/ci.yml).
# Runs on pull requests and pushes to main. No AWS access, no deployment — purely
# verifies the code: secret scanning, build + unit/integration tests + SAST.
# Dependency scanning is a separate manual workflow (dependency-check.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (GitLab `interruptible: true`).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  RUNNABLE_SERVICES: "api-gateway auth-service user-service workout-service nutrition-service analytics-service"

jobs:
  # ── precheck: secret scanning ───────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.24.2
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks container runs as root; the checkout is owned by another uid,
      # so git refuses with "dubious ownership". Allow it before scanning.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory '*'
      - name: gitleaks detect
        run: gitleaks detect --source . --verbose --redact

  # ── verify: build + unit/integration tests + coverage (JaCoCo) + SAST (SpotBugs) ──
  # Docker is available on ubuntu-latest, so Testcontainers integration tests run.
  # When SONAR_TOKEN is set, also publishes to SonarCloud/SonarQube and blocks on
  # the Quality Gate. Sonar stays off until the token is set (green by default).
  verify-backend:
    runs-on: ubuntu-latest
    needs: secret-scan
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, test, coverage + SAST (Sonar if token set)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_QUALITYGATE_WAIT: ${{ vars.SONAR_QUALITYGATE_WAIT }}
        run: |
          SONAR_ARGS=""
          if [ -n "$SONAR_TOKEN" ]; then
            SONAR_ARGS="sonar:sonar \
              -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io} \
              -Dsonar.token=$SONAR_TOKEN \
              -Dsonar.projectKey=$SONAR_PROJECT_KEY \
              -Dsonar.organization=$SONAR_ORGANIZATION \
              -Dsonar.qualitygate.wait=${SONAR_QUALITYGATE_WAIT:-true}"
          fi
          # -T 2: two modules in parallel; each spins up Testcontainers.
          mvn $MAVEN_CLI_OPTS -T 2 verify -Psast -Dspring.profiles.active=test $SONAR_ARGS
      - name: Upload build + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-artifacts
          path: |
            api-gateway/target/api-gateway-*.jar
            auth-service/target/auth-service-*.jar
            user-service/target/user-service-*.jar
            workout-service/target/workout-service-*.jar
            nutrition-service/target/nutrition-service-*.jar
            analytics-service/target/analytics-service-*.jar
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            **/target/spotbugsXml.xml
          retention-days: 5
          if-no-files-found: warn
