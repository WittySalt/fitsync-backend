# CD: provision, deploy, verify, promote.
#
# DORMANT BY DEFAULT. Every job is gated on the `AWS_ROLE_ARN` *repository
# variable* (Settings → Secrets and variables → Actions → Variables). While it is
# empty, the whole pipeline is skipped and the repo stays green. Set it (plus the
# secrets listed in each job) to enable deployment once AWS is provisioned again.
#
# AWS auth uses GitHub OIDC (no static keys). The IAM role in AWS_ROLE_ARN must
# trust GitHub's OIDC provider:
#   Provider : token.actions.githubusercontent.com
#   Audience : sts.amazonaws.com
#   Subject  : repo:WittySalt/fitsync-backend:*
#
# Flow: CI → iac → docker → deploy-staging cascade → stress/DAST → prod.
#
# Trigger. CD runs only when someone starts it (Actions → CD → Run workflow) on main,
# so staging never changes under a demo by itself. Its first job, ci-gate, refuses to
# go on unless the CI workflow succeeded on a push for exactly this commit: CI passing
# says a commit may be deployed, a person decides when (continuous delivery).
#
# Promotion rule. Staging runs only while the STAGING_ENABLED variable is 'true', so a
# run never rebuilds a staging that was destroyed to save money. A run deploys staging;
# prod deploys only when deploy_prod is ticked, and only after deploy-staging-app
# succeeded in that same run with the same image tag. (The
# manual run is the approval: required reviewers on Environments need a paid plan for
# a private repository.) The one way past staging is a manual run with skip_staging
# ticked and a reason, written to the run summary (break-glass).
name: CD

on:
  workflow_dispatch:
    inputs:
      run_stress:
        description: "Run k6 stress test against staging"
        type: boolean
        default: false
      run_dast:
        description: "Run OWASP ZAP DAST against staging"
        type: boolean
        default: false
      deploy_prod:
        description: "Deploy to production once staging succeeds in this run"
        type: boolean
        default: false
      skip_staging:
        description: "Break-glass: deploy prod without a staging run (needs a reason)"
        type: boolean
        default: false
      skip_reason:
        description: "Why staging is skipped (recorded in the run summary)"
        type: string
        default: ""

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read
  actions: read     # ci-gate reads the CI runs of this commit

env:
  # The commit this run builds and deploys (the head of main when the run started).
  RELEASE_SHA: ${{ github.sha }}
  RUNNABLE_SERVICES: "api-gateway auth-service user-service workout-service nutrition-service analytics-service recommendation-service notification-service"
  TF_VERSION: "1.15.7"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ── ci-gate: deploy only a commit on main whose CI passed ────────────────────
  ci-gate:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "CD deploys main only, not $GITHUB_REF."; exit 1
          fi
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&status=success" --jq '.total_count')"
          if [ "$passed" -lt 1 ]; then
            echo "No successful CI run on main for $RELEASE_SHA yet; wait for CI, then run CD again."; exit 1
          fi
          echo "CI passed for $RELEASE_SHA."

  # ── iac: terraform plan for staging (review only) ───────────────────────────
  # The plan is printed, not uploaded: a saved plan file can hold generated secrets
  # in plain text, and artifacts are readable by anyone who can read the repo.
  tf-plan:
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.STAGING_ENABLED == 'true' && !inputs.skip_staging }}
    runs-on: ubuntu-latest
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform plan (staging)
        working-directory: infra/terraform
        env:
          TF_VAR_ec2_public_key: ${{ vars.STAGING_EC2_PUBLIC_KEY }}
        run: |
          terraform init
          terraform workspace select staging || terraform workspace new staging
          terraform plan -input=false -var-file=staging.tfvars

  # ── docker: build jars, build + Trivy-scan + push the 8 service images ───────
  docker-image:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      # Cache Trivy's vuln + Java DB (~1GB) across runs.
      - uses: actions/cache@v4
        with:
          path: .trivycache
          key: trivy-db
      - name: Build jars, scan + push images
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SHORT_SHA="${RELEASE_SHA:0:8}"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          # The Dockerfile copies pre-built jars, so package first.
          mvn --batch-mode --no-transfer-progress -DskipTests package
          # Build + tag all 8 services (no push yet).
          ECR_REGISTRY="$ECR_REGISTRY" IMAGE_TAG="$SHORT_SHA" PUSH=0 bash scripts/build-images.sh
          for svc in $RUNNABLE_SERVICES; do
            repo="fitsync-$svc"; img="$ECR_REGISTRY/$repo"
            echo "==> $repo: ensure ECR repo, scan, push"
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" \
                   --image-scanning-configuration scanOnPush=true >/dev/null
            # Triage report of fixable HIGH+CRITICAL (non-blocking).
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
              -v "$PWD/.trivycache:/root/.cache/trivy" \
              aquasec/trivy:0.56.2 image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile /work/.trivyignore \
              --format table "$img:$SHORT_SHA"
            # Gate: block push only on fixable CRITICAL CVEs.
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
              -v "$PWD/.trivycache:/root/.cache/trivy" \
              aquasec/trivy:0.56.2 image --scanners vuln --severity CRITICAL --ignore-unfixed --ignorefile /work/.trivyignore \
              --exit-code 1 --format sarif --output "/work/trivy-$svc.sarif" "$img:$SHORT_SHA"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
              -v "$PWD/.trivycache:/root/.cache/trivy" \
              aquasec/trivy:0.56.2 image --format cyclonedx --output "/work/sbom-$svc.json" "$img:$SHORT_SHA"
            docker tag "$img:$SHORT_SHA" "$img:latest"
            docker push "$img:$SHORT_SHA"
            docker push "$img:latest"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sbom-reports
          path: |
            trivy-*.sarif
            sbom-*.json
          retention-days: 5
          if-no-files-found: warn

  # ── deploy-staging: terraform apply (provision/update staging) ──────────────
  # Applies a fresh plan (the reviewed one is printed by tf-plan, never stored).
  deploy-staging:
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.STAGING_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_staging) }}
    runs-on: ubuntu-latest
    needs: [tf-plan, docker-image]
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform apply (staging)
        working-directory: infra/terraform
        env:
          TF_VAR_ec2_public_key: ${{ vars.STAGING_EC2_PUBLIC_KEY }}
        run: |
          terraform init
          terraform workspace select staging
          terraform apply -input=false -auto-approve -var-file=staging.tfvars

  # ── deploy the app onto the staging host ────────────────────────────────────
  deploy-staging-app:
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.STAGING_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_staging) }}
    runs-on: ubuntu-latest
    needs: [deploy-staging, docker-image]
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Install the Session Manager plugin
        # ssh and scp reach the host through SSM Session Manager (port 22 is closed).
        run: |
          curl -fsSLo /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Render .env + deploy via ec2-deploy.sh
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          STAGING_EC2_SSH_KEY: ${{ secrets.STAGING_EC2_SSH_KEY }}
          STAGING_CORS_ALLOWED_ORIGINS: ${{ vars.STAGING_CORS_ALLOWED_ORIGINS }}
          # Email notifications. Set them per environment (Settings -> Environments) when staging
          # and prod send from different addresses; unset = emails are only logged.
          NOTIFY_EMAIL_ENABLED: ${{ vars.NOTIFY_EMAIL_ENABLED }}
          NOTIFY_EMAIL_SENDER: ${{ vars.NOTIFY_EMAIL_SENDER }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          RECOMMENDATION_AI_ENABLED: ${{ vars.RECOMMENDATION_AI_ENABLED }}
          RECOMMENDATION_AI_PROVIDER: ${{ vars.RECOMMENDATION_AI_PROVIDER }}
          RECOMMENDATION_AI_MODEL: ${{ vars.RECOMMENDATION_AI_MODEL }}
          RECOMMENDATION_AI_BASE_URL: ${{ vars.RECOMMENDATION_AI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          cd infra/terraform
          terraform init && terraform workspace select staging
          STAGING_INSTANCE_ID="$(terraform output -raw ec2_instance_id)"
          # auth-service must trust staging's own pool, not the prod default in compose.
          COGNITO_POOL_ID="$(terraform output -raw cognito_user_pool_id)"
          COGNITO_CLIENT_ID="$(terraform output -raw cognito_spa_client_id)"
          # Staging uploads to its own bucket, never to prod's.
          MEDIA_BUCKET="$(terraform output -raw media_bucket)"
          MEDIA_PUBLIC_BASE_URL="$(terraform output -raw media_public_base_url)"
          cd "$GITHUB_WORKSPACE"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="${RELEASE_SHA:0:8}"
          # Links in emails point at staging's SPA: APP_BASE_URL if set, else the first https
          # origin in the staging CORS list, else the staging CloudFront address.
          if [ -z "${APP_BASE_URL:-}" ]; then
            for origin in ${STAGING_CORS_ALLOWED_ORIGINS//,/ }; do
              case "$origin" in https://*) APP_BASE_URL="$origin"; break ;; esac
            done
          fi
          APP_BASE_URL="${APP_BASE_URL:-https://d1z92tpb353lfi.cloudfront.net}"
          mkdir -p ~/.ssh
          # GitHub drops a secret's trailing newline; OpenSSH refuses a key without one.
          printf '%s\n' "$STAGING_EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Port 22 is closed: ssh and scp tunnel through SSM Session Manager to the instance
          # id, authenticated by this job's AWS role, and still log in with the deploy key.
          # ssh-keyscan cannot use a ProxyCommand, so the host key is accepted on first use
          # over that tunnel. A freshly built host needs a minute before its agent is online.
          for i in $(seq 1 30); do
            status="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$STAGING_INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)"
            [ "$status" = "Online" ] && break
            [ "$i" = 30 ] && { echo "SSM agent on $STAGING_INSTANCE_ID is not online ($status)" >&2; exit 1; }
            sleep 10
          done
          cat > ~/.ssh/config <<SSHCFG
          Host fitsync-host
            HostName $STAGING_INSTANCE_ID
            User ec2-user
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ProxyCommand aws ssm start-session --region $AWS_REGION --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p
          SSHCFG
          chmod 600 ~/.ssh/config
          cat > .env.deploy <<EOF
          ECR_REGISTRY=$ECR_REGISTRY
          IMAGE_TAG=$IMAGE_TAG
          JWT_EXPIRATION=PT15M
          REDIS_HOST=redis
          REDIS_PORT=6379
          SPRING_CACHE_TYPE=redis
          SPRING_DATA_REDIS_HOST=redis
          SPRING_DATA_REDIS_PORT=6379
          KAFKA_ENABLED=true
          OUTBOX_RELAY_ENABLED=true
          KAFKA_BOOTSTRAP_SERVERS=kafka:29092
          KAFKA_USER_REGISTERED_LISTENER_ENABLED=true
          KAFKA_GOAL_UPDATED_LISTENER_ENABLED=true
          KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED=true
          KAFKA_NUTRITION_REFERENCE_PROFILE_UPDATED_LISTENER_ENABLED=true
          KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED=true
          KAFKA_MEAL_LOGGED_LISTENER_ENABLED=true
          KAFKA_MEAL_UPDATED_LISTENER_ENABLED=true
          KAFKA_MEAL_DELETED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_DELETED_LISTENER_ENABLED=true
          KAFKA_ANALYTICS_ENERGY_PROFILE_LISTENER_ENABLED=true
          KAFKA_PERSONAL_RECORD_ACHIEVED_LISTENER_ENABLED=true
          KAFKA_ACCOUNT_DELETED_LISTENER_ENABLED=true
          KAFKA_USER_PROFILE_UPDATED_LISTENER_ENABLED=true
          KAFKA_RECIPE_COOKED_LISTENER_ENABLED=true
          KAFKA_ENERGY_PROFILE_COMPUTED_LISTENER_ENABLED=true
          KAFKA_WEEKLY_RECAP_GENERATED_LISTENER_ENABLED=true
          KAFKA_STREAK_MILESTONE_REACHED_LISTENER_ENABLED=true
          KAFKA_NOTIFICATION_PREFERENCES_UPDATED_LISTENER_ENABLED=true
          KAFKA_ACCOUNT_DELETION_REQUESTED_LISTENER_ENABLED=true
          KAFKA_ACCOUNT_DELETION_CANCELLED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_PLAN_SCHEDULE_CHANGED_LISTENER_ENABLED=true
          RECOMMENDATION_AI_ENABLED=${RECOMMENDATION_AI_ENABLED:-false}
          RECOMMENDATION_AI_PROVIDER=${RECOMMENDATION_AI_PROVIDER}
          RECOMMENDATION_AI_MODEL=${RECOMMENDATION_AI_MODEL}
          RECOMMENDATION_AI_BASE_URL=${RECOMMENDATION_AI_BASE_URL}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          FITSYNC_NOTIFY_EMAIL_ENABLED=${NOTIFY_EMAIL_ENABLED:-false}
          FITSYNC_NOTIFY_EMAIL_SENDER=${NOTIFY_EMAIL_SENDER}
          FITSYNC_NOTIFY_SENDER_NAME="FitSync Staging"
          FITSYNC_NOTIFY_SUBJECT_PREFIX="[Staging]"
          FITSYNC_APP_BASE_URL=${APP_BASE_URL}
          AWS_REGION=${AWS_REGION}
          COGNITO_ENABLED=false
          AUTH_COGNITO_ISSUER_URI=https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_POOL_ID}
          AUTH_COGNITO_AUDIENCE=${COGNITO_CLIENT_ID}
          FITSYNC_CORS_ALLOWED_ORIGINS=${STAGING_CORS_ALLOWED_ORIGINS}
          NGINX_SERVER_NAME=_
          NGINX_CERT_NAME=localhost
          FITSYNC_MEDIA_ENDPOINT=https://s3.${AWS_REGION}.amazonaws.com
          FITSYNC_MEDIA_REGION=${AWS_REGION}
          FITSYNC_MEDIA_AWS_DEFAULT_CREDENTIALS=true
          FITSYNC_MEDIA_BUCKET=${MEDIA_BUCKET}
          FITSYNC_MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL}
          FREE_EXERCISE_DB_IMAGES_DIR=/opt/fitsync/free-exercise-db/exercises
          EOF
          ssh fitsync-host "sudo mkdir -p /opt/fitsync/nginx && sudo chown -R ec2-user:ec2-user /opt/fitsync"
          scp docker-compose.prod.yml "fitsync-host:/opt/fitsync/docker-compose.prod.yml"
          scp nginx/nginx.conf.template "fitsync-host:/opt/fitsync/nginx/nginx.conf.template"
          scp scripts/ec2-deploy.sh "fitsync-host:/opt/fitsync/ec2-deploy.sh"
          scp scripts/bootstrap-db.sql "fitsync-host:/opt/fitsync/bootstrap-db.sql"
          scp .env.deploy "fitsync-host:/opt/fitsync/.env"
          # DB endpoint, service passwords and JWT key come from Secrets Manager on the host.
          ssh fitsync-host \
            "ECR_REGISTRY='$ECR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' AWS_REGION='$AWS_REGION' APP_SECRET_ID='fitsync-staging/app' bash /opt/fitsync/ec2-deploy.sh"
          # The gateway port is open to the ALB only, so check it from the host itself.
          ssh fitsync-host \
            "curl -fsS -o /dev/null http://localhost:8088/actuator/health"
          echo "Staging gateway healthy on $STAGING_INSTANCE_ID"

  # ── stress test against staging (manual via workflow_dispatch input) ────────
  stress-test:
    if: ${{ vars.AWS_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' && inputs.run_stress }}
    runs-on: ubuntu-latest
    needs: [deploy-staging-app]
    continue-on-error: true
    # The k6 image runs as a non-root user, which cannot write the runner's
    # /__w/_temp files, so checkout and upload-artifact fail with EACCES. Run as root.
    container:
      image: grafana/k6:0.49.0
      options: --entrypoint "" --user root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: k6 load test
        env:
          STRESS_TARGET_URL: ${{ vars.STRESS_TARGET_URL }}
          STRESS_USER_EMAIL: ${{ secrets.STRESS_USER_EMAIL }}
          STRESS_USER_PASSWORD: ${{ secrets.STRESS_USER_PASSWORD }}
          STRESS_PROFILE: ${{ vars.STRESS_PROFILE }}
          STRESS_COGNITO_CLIENT_ID: ${{ vars.STRESS_COGNITO_CLIENT_ID }}
          STRESS_RATE_PER_MIN: ${{ vars.STRESS_RATE_PER_MIN }}
          STRESS_EXPECT_RATE_LIMIT: ${{ vars.STRESS_EXPECT_RATE_LIMIT }}
        run: |
          if [ -z "$STRESS_TARGET_URL" ]; then
            echo "STRESS_TARGET_URL is not set."; exit 1
          fi
          k6 run -e BASE_URL="$STRESS_TARGET_URL" -e USER_EMAIL="$STRESS_USER_EMAIL" \
            -e USER_PASSWORD="$STRESS_USER_PASSWORD" -e PROFILE="${STRESS_PROFILE:-load}" \
            -e COGNITO_CLIENT_ID="$STRESS_COGNITO_CLIENT_ID" \
            -e RATE_PER_MIN="${STRESS_RATE_PER_MIN:-50}" \
            -e EXPECT_RATE_LIMIT="${STRESS_EXPECT_RATE_LIMIT:-false}" \
            stress/k6/load-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: |
            stress/k6/summary.json
            stress/k6/summary.txt
          retention-days: 30
          if-no-files-found: warn

  # ── OWASP ZAP DAST against staging (manual via workflow_dispatch input) ─────
  owasp-zap:
    if: ${{ vars.AWS_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' && inputs.run_dast }}
    runs-on: ubuntu-latest
    needs: [deploy-staging-app]
    continue-on-error: true
    steps:
      - name: ZAP baseline scan
        env:
          DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}
        run: |
          if [ -z "$DAST_TARGET_URL" ]; then
            echo "DAST_TARGET_URL is not set."; exit 1
          fi
          mkdir -p dast && chmod 0777 dast
          docker run --rm -v "$PWD/dast:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$DAST_TARGET_URL" \
            -r zap-baseline.html -w zap-baseline.md -J zap-baseline.json -I || true
          ls -la dast/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline
          path: dast/
          retention-days: 30
          if-no-files-found: warn

  # ── promote to production ───────────────────────────────────────────────────
  # Manual runs only: deploy_prod after staging succeeded in the same run with this
  # commit's images, or a break-glass run (see the promotion rule at the top).
  deploy-prod:
    if: >-
      ${{ !cancelled() && vars.AWS_ROLE_ARN != '' && vars.PROD_EC2_INSTANCE_ID != ''
      && github.event_name == 'workflow_dispatch'
      && needs.docker-image.result == 'success'
      && ((inputs.deploy_prod && needs.deploy-staging-app.result == 'success')
          || (inputs.skip_staging && inputs.skip_reason != '')) }}
    runs-on: ubuntu-latest
    needs: [docker-image, deploy-staging-app]
    environment: production
    steps:
      - name: Record break-glass deploy
        if: ${{ needs.deploy-staging-app.result != 'success' }}
        env:
          REASON: ${{ inputs.skip_reason }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Prod deployed WITHOUT a staging run"
            echo "- By: $ACTOR"
            echo "- Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Install the Session Manager plugin
        # ssh and scp reach the host through SSM Session Manager (port 22 is closed).
        run: |
          curl -fsSLo /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Render .env + deploy to prod via ec2-deploy.sh
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PROD_EC2_INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
          PROD_EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
          COGNITO_ENABLED: ${{ vars.COGNITO_ENABLED }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          FITSYNC_MEDIA_ENDPOINT: ${{ vars.FITSYNC_MEDIA_ENDPOINT }}
          FITSYNC_MEDIA_REGION: ${{ vars.FITSYNC_MEDIA_REGION }}
          FITSYNC_MEDIA_BUCKET: ${{ vars.FITSYNC_MEDIA_BUCKET }}
          FITSYNC_MEDIA_PUBLIC_BASE_URL: ${{ vars.FITSYNC_MEDIA_PUBLIC_BASE_URL }}
          NOTIFY_EMAIL_ENABLED: ${{ vars.NOTIFY_EMAIL_ENABLED }}
          NOTIFY_EMAIL_SENDER: ${{ vars.NOTIFY_EMAIL_SENDER }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          RECOMMENDATION_AI_ENABLED: ${{ vars.RECOMMENDATION_AI_ENABLED }}
          RECOMMENDATION_AI_PROVIDER: ${{ vars.RECOMMENDATION_AI_PROVIDER }}
          RECOMMENDATION_AI_MODEL: ${{ vars.RECOMMENDATION_AI_MODEL }}
          RECOMMENDATION_AI_BASE_URL: ${{ vars.RECOMMENDATION_AI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${RELEASE_SHA:0:8}"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          # Refuse to touch prod unless all 8 images exist for this tag.
          for svc in $RUNNABLE_SERVICES; do
            docker manifest inspect "$ECR_REGISTRY/fitsync-$svc:$IMAGE_TAG" > /dev/null
          done
          mkdir -p ~/.ssh
          # GitHub drops a secret's trailing newline; OpenSSH refuses a key without one.
          printf '%s\n' "$PROD_EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Port 22 is closed: ssh and scp tunnel through SSM Session Manager to the instance
          # id, authenticated by this job's AWS role, and still log in with the deploy key.
          # ssh-keyscan cannot use a ProxyCommand, so the host key is accepted on first use
          # over that tunnel. A freshly built host needs a minute before its agent is online.
          for i in $(seq 1 30); do
            status="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$PROD_EC2_INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)"
            [ "$status" = "Online" ] && break
            [ "$i" = 30 ] && { echo "SSM agent on $PROD_EC2_INSTANCE_ID is not online ($status)" >&2; exit 1; }
            sleep 10
          done
          cat > ~/.ssh/config <<SSHCFG
          Host fitsync-host
            HostName $PROD_EC2_INSTANCE_ID
            User ec2-user
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ProxyCommand aws ssm start-session --region $AWS_REGION --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p
          SSHCFG
          chmod 600 ~/.ssh/config
          cat > .env.deploy <<EOF
          ECR_REGISTRY=$ECR_REGISTRY
          IMAGE_TAG=$IMAGE_TAG
          JWT_EXPIRATION=PT15M
          REDIS_HOST=redis
          REDIS_PORT=6379
          SPRING_CACHE_TYPE=redis
          SPRING_DATA_REDIS_HOST=redis
          SPRING_DATA_REDIS_PORT=6379
          KAFKA_ENABLED=true
          OUTBOX_RELAY_ENABLED=true
          KAFKA_BOOTSTRAP_SERVERS=kafka:29092
          KAFKA_USER_REGISTERED_LISTENER_ENABLED=true
          KAFKA_GOAL_UPDATED_LISTENER_ENABLED=true
          KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED=true
          KAFKA_NUTRITION_REFERENCE_PROFILE_UPDATED_LISTENER_ENABLED=true
          KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED=true
          KAFKA_MEAL_LOGGED_LISTENER_ENABLED=true
          KAFKA_MEAL_UPDATED_LISTENER_ENABLED=true
          KAFKA_MEAL_DELETED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_DELETED_LISTENER_ENABLED=true
          KAFKA_ANALYTICS_ENERGY_PROFILE_LISTENER_ENABLED=true
          KAFKA_PERSONAL_RECORD_ACHIEVED_LISTENER_ENABLED=true
          KAFKA_ACCOUNT_DELETED_LISTENER_ENABLED=true
          KAFKA_USER_PROFILE_UPDATED_LISTENER_ENABLED=true
          KAFKA_RECIPE_COOKED_LISTENER_ENABLED=true
          KAFKA_ENERGY_PROFILE_COMPUTED_LISTENER_ENABLED=true
          KAFKA_WEEKLY_RECAP_GENERATED_LISTENER_ENABLED=true
          KAFKA_STREAK_MILESTONE_REACHED_LISTENER_ENABLED=true
          KAFKA_NOTIFICATION_PREFERENCES_UPDATED_LISTENER_ENABLED=true
          KAFKA_ACCOUNT_DELETION_REQUESTED_LISTENER_ENABLED=true
          KAFKA_ACCOUNT_DELETION_CANCELLED_LISTENER_ENABLED=true
          KAFKA_WORKOUT_PLAN_SCHEDULE_CHANGED_LISTENER_ENABLED=true
          RECOMMENDATION_AI_ENABLED=${RECOMMENDATION_AI_ENABLED:-false}
          RECOMMENDATION_AI_PROVIDER=${RECOMMENDATION_AI_PROVIDER}
          RECOMMENDATION_AI_MODEL=${RECOMMENDATION_AI_MODEL}
          RECOMMENDATION_AI_BASE_URL=${RECOMMENDATION_AI_BASE_URL}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          FITSYNC_NOTIFY_EMAIL_ENABLED=${NOTIFY_EMAIL_ENABLED:-false}
          FITSYNC_NOTIFY_EMAIL_SENDER=${NOTIFY_EMAIL_SENDER}
          FITSYNC_NOTIFY_SENDER_NAME="FitSync"
          FITSYNC_NOTIFY_SUBJECT_PREFIX=
          FITSYNC_APP_BASE_URL=${APP_BASE_URL:-https://d26vi6hikexzev.cloudfront.net}
          AWS_REGION=${AWS_REGION}
          COGNITO_ENABLED=${COGNITO_ENABLED:-false}
          NGINX_SERVER_NAME=${PROD_DOMAIN:-_}
          NGINX_CERT_NAME=${PROD_DOMAIN:-localhost}
          FITSYNC_MEDIA_ENDPOINT=${FITSYNC_MEDIA_ENDPOINT:-https://s3.ap-southeast-1.amazonaws.com}
          FITSYNC_MEDIA_REGION=${FITSYNC_MEDIA_REGION:-ap-southeast-1}
          FITSYNC_MEDIA_AWS_DEFAULT_CREDENTIALS=true
          FITSYNC_MEDIA_BUCKET=${FITSYNC_MEDIA_BUCKET:-fitsync-media}
          FITSYNC_MEDIA_PUBLIC_BASE_URL=${FITSYNC_MEDIA_PUBLIC_BASE_URL:-https://fitsync-media.s3.ap-southeast-1.amazonaws.com}
          FREE_EXERCISE_DB_IMAGES_DIR=/opt/fitsync/free-exercise-db/exercises
          EOF
          ssh fitsync-host "sudo mkdir -p /opt/fitsync/nginx && sudo chown -R ec2-user:ec2-user /opt/fitsync"
          scp docker-compose.prod.yml "fitsync-host:/opt/fitsync/docker-compose.prod.yml"
          scp nginx/nginx.conf.template "fitsync-host:/opt/fitsync/nginx/nginx.conf.template"
          scp scripts/ec2-deploy.sh "fitsync-host:/opt/fitsync/ec2-deploy.sh"
          scp scripts/bootstrap-db.sql "fitsync-host:/opt/fitsync/bootstrap-db.sql"
          scp .env.deploy "fitsync-host:/opt/fitsync/.env"
          # DB endpoint, service passwords and JWT key come from Secrets Manager on the host.
          ssh fitsync-host \
            "ECR_REGISTRY='$ECR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' AWS_REGION='$AWS_REGION' APP_SECRET_ID='fitsync-prod/app' bash /opt/fitsync/ec2-deploy.sh"
