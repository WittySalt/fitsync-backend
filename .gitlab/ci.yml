# ── CI: code validation ──────────────────────────────────────────────────────
# Runs on merge requests and main pushes. No AWS access, no deployment — purely
# verifies the code: secret scanning, build + unit/integration tests + SAST, and
# dependency vulnerability scanning. Shared templates live in the root
# .gitlab-ci.yml (.maven_job, .require_vars).

secret_scan:
  stage: precheck
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

verify_backend:
  stage: verify
  extends: .maven_job
  needs: ["secret_scan"]
  variables:
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    # Build, test, coverage (JaCoCo) + SAST (SpotBugs) for all modules. When a
    # SONAR_TOKEN is configured, also publish to SonarQube/SonarCloud and block on
    # the Quality Gate (code smells, coverage, duplication, security hotspots).
    # Sonar stays off until the token is set, so the pipeline is green by default.
    - |
      SONAR_ARGS=""
      if [ -n "$SONAR_TOKEN" ]; then
        SONAR_ARGS="sonar:sonar \
          -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io} \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.projectKey=$SONAR_PROJECT_KEY \
          -Dsonar.organization=$SONAR_ORGANIZATION \
          -Dsonar.qualitygate.wait=${SONAR_QUALITYGATE_WAIT:-true}"
      fi
    # -T 2 builds independent modules two-at-a-time (parallel reactor). Kept at 2
    # rather than 1C because each module's integration tests spin up Testcontainers;
    # bump toward 1C once a run confirms the runner has the memory/Docker headroom.
    - mvn $MAVEN_CLI_OPTS -T 2 verify -Psast -Dspring.profiles.active=test $SONAR_ARGS
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      # All 6 runnable fat jars — the docker stage copies these into images.
      - api-gateway/target/api-gateway-*.jar
      - auth-service/target/auth-service-*.jar
      - user-service/target/user-service-*.jar
      - workout-service/target/workout-service-*.jar
      - nutrition-service/target/nutrition-service-*.jar
      - analytics-service/target/analytics-service-*.jar
      - "**/target/surefire-reports/"
      - "**/target/failsafe-reports/"
      - "**/target/site/jacoco/"
      - "**/target/spotbugsXml.xml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

dependency_audit:
  stage: security
  extends: .maven_job
  variables:
    NVD_API_KEY: "$NVD_API_KEY"
  script:
    - mvn $MAVEN_CLI_OPTS dependency-check:aggregate -Pdependency-check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/dependency-check-report.*
  rules:
    # Visible-but-manual on main pipelines (and web): a clickable ▶️ button in the
    # pipeline graph. Kept manual rather than automatic because the NVD database
    # download + aggregate scan adds several minutes to a run.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
