spring:
  application:
    name: auth-service
  profiles:
    default: local
  datasource:
    url: ${LOCAL_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fitsync}}
    username: ${LOCAL_DB_USERNAME:${DB_USERNAME:fitsync}}
    password: ${LOCAL_DB_PASSWORD:${DB_PASSWORD:fitsync}}
    hikari:
      schema: auth
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: auth
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth
    table: auth_flyway_schema_history
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # The session deny-list is written after a sign-out commits; an unreachable Redis must not hold the
      # request for Lettuce's default of a minute.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8080}
  # Let Tomcat's RemoteIpValve take the client address from X-Forwarded-For, but only when the request
  # comes from a trusted private-range proxy (nginx, the load balancer); a client-sent header is ignored.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    # Access-token lifetime. Short, because a device is kept signed in by its refresh token instead.
    expiration: ${JWT_EXPIRATION:PT15M}
  cognito:
    enabled: ${COGNITO_ENABLED:false}
    issuer-uri: ${COGNITO_ISSUER_URI:}
    jwk-set-uri: ${COGNITO_JWK_SET_URI:}
    audience: ${COGNITO_AUDIENCE:}
    principal-claim: ${COGNITO_PRINCIPAL_CLAIM:username}

fitsync:
  auth:
    local-accounts-enabled: ${AUTH_LOCAL_ACCOUNTS_ENABLED:false}
    sessions:
      # Sliding: every refresh starts this again.
      refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
  account-deletion:
    grace-days: ${ACCOUNT_DELETION_GRACE_DAYS:30}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:30000}
