spring:
  datasource:
    url: jdbc:h2:mem:fitsync;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

security:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expiration: PT1H
