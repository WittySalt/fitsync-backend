spring:
  datasource:
    url: jdbc:h2:mem:fitsync;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS auth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      schema: auth
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    default-schema: auth
    schemas: auth
    table: auth_flyway_schema_history
  data:
    redis:
      repositories:
        enabled: false
      # No Redis in the test JVM: the session deny-list must give up quickly instead of after a minute.
      timeout: 200ms
      connect-timeout: 200ms

security:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expiration: PT1H

fitsync:
  account-deletion:
    purge:
      # Tests call AccountPurgeService directly; no run at startup or on a schedule.
      enabled: false
