spring:
  application:
    name: analytics-service
  profiles:
    default: local
  datasource:
    url: ${LOCAL_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fitsync}}
    username: ${LOCAL_DB_USERNAME:${DB_USERNAME:fitsync}}
    password: ${LOCAL_DB_PASSWORD:${DB_PASSWORD:fitsync}}
    hikari:
      schema: analytics
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: analytics
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: analytics
    schemas: analytics
    table: analytics_flyway_schema_history
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration: ${JWT_EXPIRATION:PT2H}

fitsync:
  analytics:
    rollup:
      cron: "${ANALYTICS_ROLLUP_CRON:0 5 0 * * *}"
    weekly-recap:
      cron: "${ANALYTICS_WEEKLY_RECAP_CRON:0 15 0 * * MON}"
    trends:
      max-range-days:
        day: ${ANALYTICS_TRENDS_MAX_RANGE_DAYS_DAY:370}
        week: ${ANALYTICS_TRENDS_MAX_RANGE_DAYS_WEEK:1095}
        month: ${ANALYTICS_TRENDS_MAX_RANGE_DAYS_MONTH:1830}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      user-events: ${KAFKA_USER_EVENTS_TOPIC:user-events}
      progress-events: ${KAFKA_PROGRESS_EVENTS_TOPIC:progress-events}
      nutrition-events: ${KAFKA_NUTRITION_EVENTS_TOPIC:nutrition-events}
      workout-events: ${KAFKA_WORKOUT_EVENTS_TOPIC:workout-events}
      analytics-events: ${KAFKA_ANALYTICS_EVENTS_TOPIC:analytics-events}
    consumer-groups:
      analytics-service: ${KAFKA_ANALYTICS_SERVICE_GROUP:analytics-consumer-group}
    listeners:
      goal-updated:
        enabled: ${KAFKA_GOAL_UPDATED_LISTENER_ENABLED:false}
      body-metrics-recorded:
        enabled: ${KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED:false}
      meal-logged:
        enabled: ${KAFKA_MEAL_LOGGED_LISTENER_ENABLED:false}
      meal-updated:
        enabled: ${KAFKA_MEAL_UPDATED_LISTENER_ENABLED:false}
      meal-deleted:
        enabled: ${KAFKA_MEAL_DELETED_LISTENER_ENABLED:false}
      workout-logged:
        enabled: ${KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED:false}
      workout-updated:
        enabled: ${KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED:false}
      workout-deleted:
        enabled: ${KAFKA_WORKOUT_DELETED_LISTENER_ENABLED:false}
      personal-record-achieved:
        enabled: ${KAFKA_PERSONAL_RECORD_ACHIEVED_LISTENER_ENABLED:false}
      user-preferences-updated:
        enabled: ${KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED:false}
      energy-profile-computed:
        enabled: ${KAFKA_ANALYTICS_ENERGY_PROFILE_LISTENER_ENABLED:false}
      user-profile-updated:
        enabled: ${KAFKA_USER_PROFILE_UPDATED_LISTENER_ENABLED:false}
      account-deleted:
        enabled: ${KAFKA_ACCOUNT_DELETED_LISTENER_ENABLED:false}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:30000}
