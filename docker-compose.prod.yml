# ─────────────────────────────────────────────────────────────────────────────
# FitSync production stack — single-host (EC2) deployment.
#
#   Managed externally : PostgreSQL  -> Amazon RDS  (DB_URL / DB_USERNAME / DB_PASSWORD)
#   On this host       : Redis (cache/session), the 6 services, nginx (TLS).
#
# Images are built + pushed by scripts/build-images.sh as fitsync-<service>.
# Provide the env values via a .env file next to this compose file
# (see .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: ${SPRING_SERVICE_MEM_LIMIT:-768m}
  networks: [fitsync-net]

# Shared env for every JWT + RDS-backed service. Kafka stays disabled in phase 1
# (no MSK) — listeners are off by default so nothing tries to reach a broker.
# DB_URL is shared (one RDS instance, one `fitsync` db); each service connects
# with its OWN least-privilege DB user (auth_svc/user_svc/...) scoped to its
# schema, so DB_USERNAME/DB_PASSWORD are set per-service below, not here.
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: ${DB_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION: ${JWT_EXPIRATION:-PT2H}
  # Event bus. KAFKA_ENABLED gates all producer/consumer wiring; bootstrap defaults
  # to the in-stack `kafka` container's INTERNAL listener (override with MSK brokers
  # in a real prod .env). OUTBOX_RELAY_ENABLED turns on the transactional-outbox
  # relay so every producer actually drains its outbox table to Kafka.
  KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
  OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-false}
  # Cap each JVM's heap to a fraction of its container mem_limit. Without this, a
  # containerized JVM defaults MaxRAMPercentage to 25% of HOST RAM (≈2 GB on a
  # t3.large) — 6 of them + Kafka would blow past 8 GB. ExitOnOutOfMemoryError
  # fails the container fast (restart) instead of GC-thrashing to a hang.
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}

# Consumer-side listener switches (default off — granular rollout). Merged into the
# consuming services (user/nutrition/analytics). A service ignores the flags for
# listeners it does not declare, so one shared block is safe.
x-kafka-consumer-env: &kafka-consumer-env
  KAFKA_USER_REGISTERED_LISTENER_ENABLED: ${KAFKA_USER_REGISTERED_LISTENER_ENABLED:-false}
  KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED: ${KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_GOAL_UPDATED_LISTENER_ENABLED: ${KAFKA_GOAL_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED: ${KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED:-false}
  KAFKA_MEAL_LOGGED_LISTENER_ENABLED: ${KAFKA_MEAL_LOGGED_LISTENER_ENABLED:-false}
  KAFKA_MEAL_UPDATED_LISTENER_ENABLED: ${KAFKA_MEAL_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_MEAL_DELETED_LISTENER_ENABLED: ${KAFKA_MEAL_DELETED_LISTENER_ENABLED:-false}
  KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED: ${KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED:-false}
  KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED: ${KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_WORKOUT_DELETED_LISTENER_ENABLED: ${KAFKA_WORKOUT_DELETED_LISTENER_ENABLED:-false}

# Object storage for media — workout exercise images AND user avatars. Both the
# workout-service (catalog import) and user-service (avatar upload) write here via
# the shared media-support S3 client. Defaults keep credentials non-blank so the
# eager S3Client bean builds and a service starts even when media is unconfigured
# (uploads are lazy). For a working prod, override FITSYNC_MEDIA_* via the deploy
# .env to point at a real AWS S3 bucket (see DEPLOY.md §8.5 "Media / images (S3)").
# Note: localhost:9000 is the LOCAL-DEV MinIO emulator only — there is no MinIO
# container in this prod stack, so leaving the defaults means images never resolve.
x-media-env: &media-env
  FITSYNC_MEDIA_ENDPOINT: ${FITSYNC_MEDIA_ENDPOINT:-http://localhost:9000}
  FITSYNC_MEDIA_REGION: ${FITSYNC_MEDIA_REGION:-ap-southeast-1}
  FITSYNC_MEDIA_ACCESS_KEY: ${FITSYNC_MEDIA_ACCESS_KEY:-fitsync}
  FITSYNC_MEDIA_SECRET_KEY: ${FITSYNC_MEDIA_SECRET_KEY:-fitsync-password}
  FITSYNC_MEDIA_BUCKET: ${FITSYNC_MEDIA_BUCKET:-fitsync-media}
  FITSYNC_MEDIA_PUBLIC_BASE_URL: ${FITSYNC_MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/fitsync-media}

services:
  redis:
    image: redis:7-alpine
    container_name: fitsync-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [fitsync-net]

  # Single-node KRaft broker for the event bus. Behind the `events` profile so a
  # default `up` (events off) does NOT start it; bring it up by naming it explicitly
  # or with `--profile events`. For a real multi-AZ prod, drop this and point
  # KAFKA_BOOTSTRAP_SERVERS at MSK instead. Services reach it on INTERNAL kafka:29092;
  # 9092 is published on loopback only for host-side debugging on the EC2 box.
  kafka:
    image: apache/kafka:3.7.0
    container_name: fitsync-kafka
    profiles: ["events"]
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    environment:
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fitsync-net]

  api-gateway:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-api-gateway:${IMAGE_TAG:-latest}
    container_name: fitsync-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      # The gateway is a byte-forwarding proxy (@RequestBody byte[]). It must NOT parse
      # multipart/form-data: the multipart resolver consumes the request input stream, so
      # reading the body as bytes then throws -> catch-all 500, and avatar uploads never
      # reach user-service. Disabling multipart parsing lets the raw bytes forward intact;
      # user-service does the real multipart handling (2MB cap).
      SPRING_SERVLET_MULTIPART_ENABLED: ${GATEWAY_MULTIPART_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      COGNITO_ENABLED: ${COGNITO_ENABLED:-false}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-}
      COGNITO_AUDIENCE: ${COGNITO_AUDIENCE:-}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI:-}
      COGNITO_PRINCIPAL_CLAIM: ${COGNITO_PRINCIPAL_CLAIM:-username}
      AUTH_SERVICE_BASE_URL: http://auth-service:8080
      USER_SERVICE_BASE_URL: http://user-service:8081
      WORKOUT_SERVICE_BASE_URL: http://workout-service:8082
      NUTRITION_SERVICE_BASE_URL: http://nutrition-service:8083
      ANALYTICS_SERVICE_BASE_URL: http://analytics-service:8085
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      auth-service: {condition: service_healthy}
      user-service: {condition: service_healthy}
      workout-service: {condition: service_healthy}
      nutrition-service: {condition: service_healthy}
      analytics-service: {condition: service_healthy}

  auth-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-auth-service:${IMAGE_TAG:-latest}
    container_name: fitsync-auth-service
    environment:
      <<: *app-env
      # auth-service validates the Cognito ID token at /api/v1/auth/bootstrap and
      # exchanges it for a local FitSync JWT. Enabled via env vars, NOT the `cognito`
      # profile: application-cognito.yml is gitignored, so it is absent from the
      # CI-built jar and the profile would be a no-op (every bootstrap returns 401).
      # Pool id + app client id are public (the SPA app client has no secret). The
      # gateway must NOT enable Cognito — it crashes when Cognito is on there.
      COGNITO_ENABLED: "true"
      COGNITO_ISSUER_URI: https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_myVyuOmPD
      COGNITO_AUDIENCE: 4mvse0cgmkplgocfg827uolvad
      COGNITO_PRINCIPAL_CLAIM: username
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      SERVER_PORT: 8080
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      redis: {condition: service_healthy}

  user-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-user-service:${IMAGE_TAG:-latest}
    container_name: fitsync-user-service
    environment:
      <<: [*app-env, *kafka-consumer-env, *media-env]
      DB_USERNAME: user_svc
      DB_PASSWORD: ${USER_DB_PASSWORD}
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  workout-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-workout-service:${IMAGE_TAG:-latest}
    container_name: fitsync-workout-service
    environment:
      <<: [*app-env, *media-env]
      DB_USERNAME: workout_svc
      DB_PASSWORD: ${WORKOUT_DB_PASSWORD}
      SERVER_PORT: 8082
      FREE_EXERCISE_DB_IMAGE_SOURCE_DIRECTORY: ${FREE_EXERCISE_DB_IMAGE_SOURCE_DIRECTORY:-/opt/fitsync/free-exercise-db/exercises}
      WORKOUT_CATALOG_AUTO_IMPORT: ${WORKOUT_CATALOG_AUTO_IMPORT:-true}
    volumes:
      - ${FREE_EXERCISE_DB_IMAGES_DIR:-./.local/free-exercise-db/exercises}:/opt/fitsync/free-exercise-db/exercises:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nutrition-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-nutrition-service:${IMAGE_TAG:-latest}
    container_name: fitsync-nutrition-service
    environment:
      <<: [*app-env, *kafka-consumer-env]
      DB_USERNAME: nutrition_svc
      DB_PASSWORD: ${NUTRITION_DB_PASSWORD}
      SERVER_PORT: 8083
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  analytics-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-analytics-service:${IMAGE_TAG:-latest}
    container_name: fitsync-analytics-service
    environment:
      <<: [*app-env, *kafka-consumer-env]
      DB_USERNAME: analytics_svc
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      SERVER_PORT: 8085
      # analytics uses the SPRING_DATA_REDIS_* names (not REDIS_HOST). Cache stays
      # 'simple' in phase 1; set SPRING_CACHE_TYPE=redis to use the redis container.
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-simple}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      redis: {condition: service_healthy}

  nginx:
    image: nginx:1.27-alpine
    container_name: fitsync-nginx
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CERT_NAME: ${NGINX_CERT_NAME}
    command: >
      /bin/sh -c "envsubst '$$NGINX_SERVER_NAME $$NGINX_CERT_NAME'
      < /etc/nginx/templates/nginx.conf.template
      > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [fitsync-net]

networks:
  fitsync-net:
    driver: bridge

volumes:
  redis-data:
  kafka-data:
