# ─────────────────────────────────────────────────────────────────────────────
# FitSync production stack — single-host (EC2) deployment.
#
#   Managed externally : PostgreSQL  -> Amazon RDS  (DB_URL / DB_USERNAME / DB_PASSWORD)
#   On this host       : Redis (cache/session), Kafka, the 8 services, nginx (TLS).
#
# Images are built + pushed by scripts/build-images.sh as fitsync-<service>.
# Provide the env values via a .env file next to this compose file
# (see .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: ${SPRING_SERVICE_MEM_LIMIT:-768m}
  networks: [fitsync-net]

# Shared env for every JWT + RDS-backed service. Kafka stays disabled in phase 1
# (no MSK) — listeners are off by default so nothing tries to reach a broker.
# DB_URL is shared (one RDS instance, one `fitsync` db); each service connects
# with its OWN least-privilege DB user (auth_svc/user_svc/...) scoped to its
# schema, so DB_USERNAME/DB_PASSWORD are set per-service below, not here.
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: ${DB_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION: ${JWT_EXPIRATION:-PT15M}
  # Event bus. KAFKA_ENABLED gates all producer/consumer wiring; bootstrap defaults
  # to the in-stack `kafka` container's INTERNAL listener (override with MSK brokers
  # in a real prod .env). OUTBOX_RELAY_ENABLED turns on the transactional-outbox
  # relay so every producer actually drains its outbox table to Kafka.
  KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
  OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-false}
  # Cap each JVM's heap to a fraction of its container mem_limit. Without this, a
  # containerized JVM defaults MaxRAMPercentage to 25% of HOST RAM (≈2 GB on a
  # t3.large) — 6 of them + Kafka would blow past 8 GB. ExitOnOutOfMemoryError
  # fails the container fast (restart) instead of GC-thrashing to a hang.
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}

# Consumer-side listener switches (default off — granular rollout). Merged into the
# consuming services (user/workout/nutrition/analytics/recommendation/notification). A service ignores the flags for
# listeners it does not declare, so one shared block is safe.
x-kafka-consumer-env: &kafka-consumer-env
  KAFKA_USER_REGISTERED_LISTENER_ENABLED: ${KAFKA_USER_REGISTERED_LISTENER_ENABLED:-false}
  KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED: ${KAFKA_USER_PREFERENCES_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_NUTRITION_REFERENCE_PROFILE_UPDATED_LISTENER_ENABLED: ${KAFKA_NUTRITION_REFERENCE_PROFILE_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_GOAL_UPDATED_LISTENER_ENABLED: ${KAFKA_GOAL_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED: ${KAFKA_BODY_METRICS_RECORDED_LISTENER_ENABLED:-false}
  KAFKA_MEAL_LOGGED_LISTENER_ENABLED: ${KAFKA_MEAL_LOGGED_LISTENER_ENABLED:-false}
  KAFKA_MEAL_UPDATED_LISTENER_ENABLED: ${KAFKA_MEAL_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_MEAL_DELETED_LISTENER_ENABLED: ${KAFKA_MEAL_DELETED_LISTENER_ENABLED:-false}
  KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED: ${KAFKA_WORKOUT_LOGGED_LISTENER_ENABLED:-false}
  KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED: ${KAFKA_WORKOUT_UPDATED_LISTENER_ENABLED:-false}
  KAFKA_WORKOUT_DELETED_LISTENER_ENABLED: ${KAFKA_WORKOUT_DELETED_LISTENER_ENABLED:-false}
  KAFKA_PERSONAL_RECORD_ACHIEVED_LISTENER_ENABLED: ${KAFKA_PERSONAL_RECORD_ACHIEVED_LISTENER_ENABLED:-false}
  # Consumed by several services (account deletion cascades into nutrition, workout, analytics
  # and recommendation; profile updates feed analytics and recommendation), so they live here.
  KAFKA_ACCOUNT_DELETED_LISTENER_ENABLED: ${KAFKA_ACCOUNT_DELETED_LISTENER_ENABLED:-false}
  KAFKA_USER_PROFILE_UPDATED_LISTENER_ENABLED: ${KAFKA_USER_PROFILE_UPDATED_LISTENER_ENABLED:-false}

# Object storage for media — workout exercise images AND user avatars. Both the
# workout-service (catalog import) and user-service (avatar upload) write here via
# the shared media-support S3 client. Defaults keep credentials non-blank so the
# eager S3Client bean builds and a service starts even when media is unconfigured
# (uploads are lazy). For a working prod, override FITSYNC_MEDIA_* via the deploy
# .env to point at a real AWS S3 bucket (see DEPLOY.md §8.5 "Media / images (S3)").
# Note: localhost:9000 is the LOCAL-DEV MinIO emulator only — there is no MinIO
# container in this prod stack, so leaving the defaults means images never resolve.
x-media-env: &media-env
  FITSYNC_MEDIA_ENDPOINT: ${FITSYNC_MEDIA_ENDPOINT:-http://localhost:9000}
  FITSYNC_MEDIA_REGION: ${FITSYNC_MEDIA_REGION:-ap-southeast-1}
  FITSYNC_MEDIA_ACCESS_KEY: ${FITSYNC_MEDIA_ACCESS_KEY:-fitsync}
  FITSYNC_MEDIA_SECRET_KEY: ${FITSYNC_MEDIA_SECRET_KEY:-fitsync-password}
  # true in the cloud: uploads use the EC2 instance role and the two keys above are ignored.
  FITSYNC_MEDIA_AWS_DEFAULT_CREDENTIALS: ${FITSYNC_MEDIA_AWS_DEFAULT_CREDENTIALS:-false}
  FITSYNC_MEDIA_BUCKET: ${FITSYNC_MEDIA_BUCKET:-fitsync-media}
  FITSYNC_MEDIA_PUBLIC_BASE_URL: ${FITSYNC_MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/fitsync-media}

services:
  redis:
    image: redis:7-alpine
    container_name: fitsync-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    # Short-lived data only, and every key has a TTL: analytics-service's read caches (rebuilt
    # from the database), the gateway's rate-limit counters, and the session deny-list
    # (fitsync:revoked-sid:*) that auth-service writes and the gateway checks. maxmemory stays
    # well under mem_limit for Redis's own overhead, and allkeys-lru drops the least recently
    # used entries instead of refusing writes when it is full. Persistence is off: a restart
    # starts empty, and no snapshot fork doubles the memory. Losing a deny-list entry this way
    # is acceptable, because the database still refuses that session's next refresh, so a
    # revoked device is out within one access-token lifetime (15 minutes).
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-160mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    # Healthcheck timeouts in this file allow for the deploy burst. When the CD recreates the
    # eight JVM services at once, the t3.large is CPU-bound for a few minutes, and a probe that
    # normally answers in milliseconds can take several seconds. A tight timeout then marks a
    # working container unhealthy and fails `up --wait`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
    networks: [fitsync-net]

  # Single-node KRaft broker for the event bus. Behind the `events` profile so a
  # default `up` (events off) does NOT start it; bring it up by naming it explicitly
  # or with `--profile events`. For a real multi-AZ prod, drop this and point
  # KAFKA_BOOTSTRAP_SERVERS at MSK instead. Services reach it on INTERNAL kafka:29092;
  # 9092 is published on loopback only for host-side debugging on the EC2 box.
  kafka:
    image: apache/kafka:3.7.0
    container_name: fitsync-kafka
    profiles: ["events"]
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    environment:
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    # A real broker check: an admin client lists the topics. It starts a JVM on every probe,
    # and that JVM would otherwise inherit KAFKA_HEAP_OPTS (the broker's own 512m heap) and the
    # broker's G1 flags inside the same 768m container. The probe therefore gets a small heap,
    # the serial collector and the C1 compiler only, which start fastest. While the services
    # start after a deploy the probe can still take well over 5s, so the timeout is 30s and the
    # broker is marked unhealthy only after several minutes of failed probes. start_period
    # covers a cold broker start (KRaft format and log recovery) on a fresh host.
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' KAFKA_JVM_PERFORMANCE_OPTS='-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.awt.headless=true' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 8
      start_period: 90s
    networks: [fitsync-net]

  api-gateway:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-api-gateway:${IMAGE_TAG:-latest}
    container_name: fitsync-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      # The gateway is a byte-forwarding proxy (@RequestBody byte[]). It must NOT parse
      # multipart/form-data: the multipart resolver consumes the request input stream, so
      # reading the body as bytes then throws -> catch-all 500, and avatar uploads never
      # reach user-service. Disabling multipart parsing lets the raw bytes forward intact;
      # user-service does the real multipart handling (2MB cap).
      SPRING_SERVLET_MULTIPART_ENABLED: ${GATEWAY_MULTIPART_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      COGNITO_ENABLED: ${COGNITO_ENABLED:-false}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-}
      COGNITO_AUDIENCE: ${COGNITO_AUDIENCE:-}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI:-}
      COGNITO_PRINCIPAL_CLAIM: ${COGNITO_PRINCIPAL_CLAIM:-username}
      # CORS allowlist. Pass-through so each environment can add its own SPA
      # origin (the browser sends Origin on POST even same-origin; an un-listed
      # origin is rejected 403, which the SPA CloudFront then serves as the
      # index.html error page). The default is prod's list: its CloudFront name
      # and the apex and www custom domains on the same distribution.
      FITSYNC_CORS_ALLOWED_ORIGINS: ${FITSYNC_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,https://d26vi6hikexzev.cloudfront.net,https://fitsyncapp.click,https://www.fitsyncapp.click}
      AUTH_SERVICE_BASE_URL: http://auth-service:8080
      USER_SERVICE_BASE_URL: http://user-service:8081
      WORKOUT_SERVICE_BASE_URL: http://workout-service:8082
      NUTRITION_SERVICE_BASE_URL: http://nutrition-service:8083
      ANALYTICS_SERVICE_BASE_URL: http://analytics-service:8085
      RECOMMENDATION_SERVICE_BASE_URL: http://recommendation-service:8086
      # Only the admin console's email "send now" goes here (/api/v1/admin/notifications/**).
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8087
      # Redis for the revoked-session deny-list that auth-service writes and for the per-user / per-IP
      # rate limit counters; both fail open if Redis is down. Two proxies append to X-Forwarded-For in
      # the cloud (CloudFront, then the ALB), hence 2 trusted hops. GATEWAY_RATE_LIMIT_ENABLED=false turns
      # the limiter off (e.g. in a local .env).
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_GENERAL: ${GATEWAY_RATE_LIMIT_GENERAL:-120}
      GATEWAY_RATE_LIMIT_AUTH: ${GATEWAY_RATE_LIMIT_AUTH:-10}
      GATEWAY_RATE_LIMIT_REFRESH: ${GATEWAY_RATE_LIMIT_REFRESH:-60}
      GATEWAY_RATE_LIMIT_TRUSTED_PROXY_HOPS: ${GATEWAY_RATE_LIMIT_TRUSTED_PROXY_HOPS:-2}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      user-service: {condition: service_healthy}
      workout-service: {condition: service_healthy}
      nutrition-service: {condition: service_healthy}
      analytics-service: {condition: service_healthy}

  auth-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-auth-service:${IMAGE_TAG:-latest}
    container_name: fitsync-auth-service
    environment:
      <<: *app-env
      # auth-service validates the Cognito ID token at /api/v1/auth/bootstrap and
      # exchanges it for a local FitSync JWT. Enabled via env vars, NOT the `cognito`
      # profile: application-cognito.yml is gitignored, so it is absent from the
      # CI-built jar and the profile would be a no-op (every bootstrap returns 401).
      # Pool id + app client id are public (the SPA app client has no secret). The
      # gateway leaves Cognito off: it only forwards /bootstrap, and every other
      # request carries the local FitSync JWT that bootstrap returns.
      #
      # Issuer/audience are parameterised so each environment points at its own
      # Cognito user pool (prod = myVyuOmPD; staging = its own pool, injected by
      # the staging deploy job). Defaults preserve prod behaviour when unset, so
      # the prod .env (which does NOT set AUTH_COGNITO_*) is unchanged.
      COGNITO_ENABLED: "true"
      COGNITO_ISSUER_URI: ${AUTH_COGNITO_ISSUER_URI:-https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_myVyuOmPD}
      COGNITO_AUDIENCE: ${AUTH_COGNITO_AUDIENCE:-4mvse0cgmkplgocfg827uolvad}
      COGNITO_PRINCIPAL_CLAIM: ${COGNITO_PRINCIPAL_CLAIM:-username}
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      SERVER_PORT: 8080
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      redis: {condition: service_healthy}

  user-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-user-service:${IMAGE_TAG:-latest}
    container_name: fitsync-user-service
    environment:
      <<: [*app-env, *kafka-consumer-env, *media-env]
      DB_USERNAME: user_svc
      DB_PASSWORD: ${USER_DB_PASSWORD}
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  workout-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-workout-service:${IMAGE_TAG:-latest}
    container_name: fitsync-workout-service
    environment:
      <<: [*app-env, *kafka-consumer-env, *media-env]
      DB_USERNAME: workout_svc
      DB_PASSWORD: ${WORKOUT_DB_PASSWORD}
      SERVER_PORT: 8082
      FREE_EXERCISE_DB_IMAGE_SOURCE_DIRECTORY: ${FREE_EXERCISE_DB_IMAGE_SOURCE_DIRECTORY:-/opt/fitsync/free-exercise-db/exercises}
      WORKOUT_CATALOG_AUTO_IMPORT: ${WORKOUT_CATALOG_AUTO_IMPORT:-true}
      # Shared catalogue search cache in the redis container; fails open to the database.
      # CATALOGUE_CACHE_TYPE=none turns it off (its own name, so analytics' SPRING_CACHE_TYPE is not touched).
      SPRING_CACHE_TYPE: ${CATALOGUE_CACHE_TYPE:-redis}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
    volumes:
      - ${FREE_EXERCISE_DB_IMAGES_DIR:-./.local/free-exercise-db/exercises}:/opt/fitsync/free-exercise-db/exercises:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  nutrition-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-nutrition-service:${IMAGE_TAG:-latest}
    container_name: fitsync-nutrition-service
    environment:
      <<: [*app-env, *kafka-consumer-env]
      DB_USERNAME: nutrition_svc
      DB_PASSWORD: ${NUTRITION_DB_PASSWORD}
      SERVER_PORT: 8083
      # Shared catalogue search cache in the redis container; fails open to the database.
      # CATALOGUE_CACHE_TYPE=none turns it off (its own name, so analytics' SPRING_CACHE_TYPE is not touched).
      SPRING_CACHE_TYPE: ${CATALOGUE_CACHE_TYPE:-redis}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  analytics-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-analytics-service:${IMAGE_TAG:-latest}
    container_name: fitsync-analytics-service
    # analytics is the heaviest service (CQRS read-model + Kafka projection); give it
    # more heap headroom than the shared 768m default so it doesn't OOM on startup.
    mem_limit: 1536m
    environment:
      <<: [*app-env, *kafka-consumer-env]
      DB_USERNAME: analytics_svc
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      SERVER_PORT: 8085
      # analytics uses the SPRING_DATA_REDIS_* names (not REDIS_HOST). Its read caches live in the
      # redis container (keys <cacheName>::<userId>..., TTL 5-10 min, evicted per user on events);
      # SPRING_CACHE_TYPE=simple falls back to an in-process cache. A Redis outage only costs
      # latency: reads fall back to the database and health ignores Redis.
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      # Consumed only by analytics; its own flag so recommendation-service is not switched on with it.
      KAFKA_ANALYTICS_ENERGY_PROFILE_LISTENER_ENABLED: ${KAFKA_ANALYTICS_ENERGY_PROFILE_LISTENER_ENABLED:-false}
      KAFKA_RECIPE_COOKED_LISTENER_ENABLED: ${KAFKA_RECIPE_COOKED_LISTENER_ENABLED:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # analytics replays/projects on startup; give it longer before being marked
      # unhealthy (other services use 40s). Pairs with the deploy --wait-timeout.
      start_period: 180s
    depends_on:
      redis: {condition: service_healthy}

  # X-5 resolved: recommendation-service ships as a standalone service in this stack
  # rather than folding into another module. It owns the `recommendation` schema, consumes
  # thirteen event streams into a per-user context projection, and serves the read API the
  # gateway proxies at /api/v1/recommendations/**.
  #
  # Its listeners are OFF by default like every other consumer. Three of them have no entry in
  # the shared x-kafka-consumer-env anchor because only this service consumes them, so they are
  # declared here.
  #
  # The AI narrative tier is off by default too. Three providers are supported: `anthropic` needs
  # ANTHROPIC_API_KEY in the environment, `ollama` needs a reachable local model and no key, and
  # `bedrock` uses the EC2 instance role (no key) with a Bedrock model or inference-profile ID.
  recommendation-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-recommendation-service:${IMAGE_TAG:-latest}
    container_name: fitsync-recommendation-service
    environment:
      <<: [*app-env, *kafka-consumer-env]
      DB_USERNAME: recommendation_svc
      DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD}
      SERVER_PORT: 8086
      # Consumed only by this service, so absent from the shared anchor.
      KAFKA_ENERGY_PROFILE_COMPUTED_LISTENER_ENABLED: ${KAFKA_ENERGY_PROFILE_COMPUTED_LISTENER_ENABLED:-false}
      KAFKA_WEEKLY_RECAP_GENERATED_LISTENER_ENABLED: ${KAFKA_WEEKLY_RECAP_GENERATED_LISTENER_ENABLED:-false}
      KAFKA_STREAK_MILESTONE_REACHED_LISTENER_ENABLED: ${KAFKA_STREAK_MILESTONE_REACHED_LISTENER_ENABLED:-false}
      # AI narrative tier (A1 weekly narrative + A4 coach Q&A).
      RECOMMENDATION_AI_ENABLED: ${RECOMMENDATION_AI_ENABLED:-false}
      RECOMMENDATION_AI_PROVIDER: ${RECOMMENDATION_AI_PROVIDER:-anthropic}
      RECOMMENDATION_AI_MODEL: ${RECOMMENDATION_AI_MODEL:-claude-sonnet-4-6}
      RECOMMENDATION_AI_BASE_URL: ${RECOMMENDATION_AI_BASE_URL:-http://localhost:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Region for the bedrock provider. On EC2 the SDK would also find it in the instance
      # metadata; set here so a local run behaves the same.
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      # The coach reads every other service through the API gateway's public paths, forwarding
      # the caller's own token, so it sees exactly what the user would see and nothing more.
      FITSYNC_COACH_API_BASE_URL: ${FITSYNC_COACH_API_BASE_URL:-http://api-gateway:8088}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      redis: {condition: service_healthy}

  # notification-service sends the product's emails (welcome, goal reached, reminders, weekly
  # recap, account deletion notices) through Amazon SES with the EC2 instance role, so no key
  # lives on the host. It owns the `notification` schema and publishes no host port. Its only
  # API is the admin console's email "send now", which the gateway forwards from
  # /api/v1/admin/notifications/** after checking the ADMIN role; it checks JWT_SECRET again.
  #
  # Email is OFF by default: with FITSYNC_NOTIFY_EMAIL_ENABLED=false every message is written to
  # the log instead of being sent. The sender must be an identity verified in SES (see
  # infra/terraform/RUNBOOK.md "Email notifications (SES)").
  #
  # Its listeners are OFF by default like every other consumer. Four have no entry in the shared
  # anchor because only this service consumes them. The weekly-recap flag is declared on
  # recommendation-service rather than in the anchor, so it is repeated here as well.
  #
  # Kafka is not a depends_on: the broker sits in the `events` profile, and a hard dependency
  # would break a plain `up` without it (the other consumers follow the same rule).
  notification-service:
    <<: *service-defaults
    image: ${ECR_REGISTRY:+${ECR_REGISTRY}/}fitsync-notification-service:${IMAGE_TAG:-latest}
    container_name: fitsync-notification-service
    # A small worker (no web traffic, a few listeners and a scheduler), so it gets less than the
    # 768m default to keep the t3.large budget under 8 GB.
    mem_limit: ${NOTIFICATION_MEM_LIMIT:-512m}
    environment:
      <<: [*app-env, *kafka-consumer-env]
      DB_USERNAME: notification_svc
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SERVER_PORT: 8087
      # Consumed only by this service, so absent from the shared anchor.
      KAFKA_NOTIFICATION_PREFERENCES_UPDATED_LISTENER_ENABLED: ${KAFKA_NOTIFICATION_PREFERENCES_UPDATED_LISTENER_ENABLED:-false}
      KAFKA_ACCOUNT_DELETION_REQUESTED_LISTENER_ENABLED: ${KAFKA_ACCOUNT_DELETION_REQUESTED_LISTENER_ENABLED:-false}
      KAFKA_ACCOUNT_DELETION_CANCELLED_LISTENER_ENABLED: ${KAFKA_ACCOUNT_DELETION_CANCELLED_LISTENER_ENABLED:-false}
      KAFKA_WORKOUT_PLAN_SCHEDULE_CHANGED_LISTENER_ENABLED: ${KAFKA_WORKOUT_PLAN_SCHEDULE_CHANGED_LISTENER_ENABLED:-false}
      KAFKA_WEEKLY_RECAP_GENERATED_LISTENER_ENABLED: ${KAFKA_WEEKLY_RECAP_GENERATED_LISTENER_ENABLED:-false}
      # Email through SES. The sender is the From address and must be verified in SES.
      FITSYNC_NOTIFY_EMAIL_ENABLED: ${FITSYNC_NOTIFY_EMAIL_ENABLED:-false}
      FITSYNC_NOTIFY_EMAIL_SENDER: ${FITSYNC_NOTIFY_EMAIL_SENDER:-no-reply@fitsync.local}
      # The From display name ("FitSync <address>") and a subject prefix; CD sets
      # "FitSync Staging" and "[Staging]" on staging so its emails stand out, prod keeps none.
      FITSYNC_NOTIFY_SENDER_NAME: ${FITSYNC_NOTIFY_SENDER_NAME:-FitSync}
      FITSYNC_NOTIFY_SUBJECT_PREFIX: ${FITSYNC_NOTIFY_SUBJECT_PREFIX:-}
      # Where the links in an email point: this environment's SPA address.
      FITSYNC_APP_BASE_URL: ${FITSYNC_APP_BASE_URL:-http://localhost:4200}
      FITSYNC_NOTIFY_TICK: ${FITSYNC_NOTIFY_TICK:-PT5M}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    container_name: fitsync-nginx
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CERT_NAME: ${NGINX_CERT_NAME}
    command: >
      /bin/sh -c "envsubst '$$NGINX_SERVER_NAME $$NGINX_CERT_NAME'
      < /etc/nginx/templates/nginx.conf.template
      > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [fitsync-net]

networks:
  fitsync-net:
    driver: bridge

volumes:
  redis-data:
  kafka-data:
